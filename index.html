<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DKE Medical English</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4A86C8; --primary-dk: #3570B0; --primary-lt: #EAF3FC;
      --green: #4CAF82;   --green-lt:  #E8F7F2;
      --red: #DC7070;
      --border: #C5DEF5; --bg: #F2F8FE; --text: #2A3F55; --muted: #7A93A8;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    .app-header { background: var(--primary); color: #fff; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 12px rgba(74,134,200,.25); }
    .app-title { font-size: 1rem; font-weight: 700; letter-spacing: .02em; }
    .badge { font-size: .75rem; background: rgba(255,255,255,.22); padding: 4px 12px; border-radius: 20px; white-space: nowrap; }

    /* ── Filters ── */
    .filter-bar { background: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); box-shadow: 0 1px 4px rgba(74,134,200,.08); }
    .filter-bar select { flex: 1 1 calc(33% - 8px); min-width: 100px; height: 38px; padding: 0 8px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .8rem; background: var(--primary-lt); color: var(--text); }

    /* ── Table ── */
    .table-scroll { overflow-x: auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(74,134,200,.1); }
    thead th { background: var(--primary); color: #fff; padding: 11px 14px; text-align: left; font-size: .78rem; font-weight: 600; letter-spacing: .03em; }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #EDF4FB; font-size: .84rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.done-row { background: var(--green-lt); }
    .ops { display: flex; gap: 10px; align-items: center; }

    /* ── Icon-only buttons (list) ── */
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; padding: 4px; border-radius: 6px; font-size: 1.05rem; min-width: 32px; min-height: 32px; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
    .icon-btn:active { opacity: .55; }
    .icon-btn.play-btn { color: var(--primary); }
    .icon-btn.play-btn:disabled { color: var(--border); pointer-events: none; }
    .icon-btn.done-btn { color: var(--muted); }
    .icon-btn.done-btn.is-done { color: var(--green); }

    .msg-c { text-align: center; padding: 48px 20px; color: var(--muted); font-size: .9rem; }
    .msg-c.err { color: var(--red); }

    footer { text-align: center; padding: 20px; font-size: .78rem; color: var(--muted); }
    footer a { color: var(--primary); text-decoration: none; }

    /* ── Overlay / Sheet ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(30,50,80,.38); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 92%; max-width: 460px; max-height: 90dvh; background: #fff; border-radius: 20px; padding: 22px 22px 28px; overflow-y: auto; box-shadow: 0 8px 40px rgba(74,134,200,.22); }

    /* ── Player ── */
    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .pl-title { font-size: .9rem; font-weight: 700; color: var(--text); line-height: 1.45; flex: 1; padding-right: 12px; }
    .btn-close { width: 30px; height: 30px; border: none; background: var(--primary-lt); border-radius: 50%; font-size: .82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--primary); }
    .btn-close:active { background: var(--border); }

    .prog-wrap { position: relative; height: 40px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; margin-bottom: 2px; }
    .prog-track { position: absolute; left: 0; right: 0; height: 5px; background: var(--primary-lt); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0; background: var(--primary); border-radius: 3px; }
    .prog-thumb { position: absolute; width: 15px; height: 15px; background: var(--primary); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 5px rgba(74,134,200,.4); }
    .time-row { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 18px; }

    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 18px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 46px; min-height: 46px; cursor: pointer; color: var(--primary); font-size: 1.35rem; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    .ctrl-btn:active { background: var(--primary-lt); }
    .ctrl-btn-main { background: var(--primary); color: #fff; min-width: 62px; min-height: 62px; font-size: 1.45rem; box-shadow: 0 4px 18px rgba(74,134,200,.35); }
    .ctrl-btn-main:active { background: var(--primary-dk); }

    /* ── Speed presets ── */
    .speed-section { margin-bottom: 18px; }
    .speed-label { font-size: .72rem; color: var(--muted); text-align: center; margin-bottom: 8px; letter-spacing: .04em; }
    .speed-preset-row { display: flex; gap: 6px; justify-content: center; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: var(--muted); font-size: .77rem; font-weight: 600; padding: 6px 10px; border-radius: 20px; cursor: pointer; min-height: 34px; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-preset.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn-preset:active { opacity: .7; }

    /* ── Mark done ── */
    .btn-mark-done { width: 100%; height: 46px; border: none; border-radius: 12px; font-size: .88rem; font-weight: 700; cursor: pointer; background: var(--green); color: #fff; -webkit-tap-highlight-color: transparent; transition: opacity .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-mark-done:active { opacity: .8; }
    .btn-mark-done.is-done { background: #E0EAF4; color: var(--muted); }
  </style>
</head>
<body>

<header class="app-header">
  <span class="app-title" id="appTitle">DKE Medical English</span>
  <span class="badge" id="completionBadge">完了: 0 / 0</span>
</header>
<script>
(function(){
  try {
    const t = localStorage.getItem('dke_site_title') ||
              (JSON.parse(localStorage.getItem('dke_settings')||'{}') || {}).siteTitle || '';
    if (t) { document.getElementById('appTitle').textContent = t; document.title = t; }
  } catch(e) {}
})();
</script>

<div class="filter-bar">
  <select id="filterYear"></select>
  <select id="filterTerm"></select>
  <select id="filterLevel"></select>
</div>

<div class="table-scroll">
  <div id="tableContainer"><div class="msg-c">読み込み中…</div></div>
</div>

<!-- Player modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose"><i class="fas fa-xmark"></i></button>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack" title="10秒戻る"><i class="fas fa-rotate-left"></i></button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay"><i class="fas fa-play" id="iconPlay"></i></button>
      <button class="ctrl-btn" id="btnFwd" title="10秒進む"><i class="fas fa-rotate-right"></i></button>
    </div>
    <div class="speed-section">
      <div class="speed-label">再生速度</div>
      <div class="speed-preset-row">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
        <button class="btn-preset" data-speed="2">2.0x</button>
      </div>
    </div>
    <button class="btn-mark-done" id="btnMarkDone">
      <i class="fas fa-check"></i><span>完了にする</span>
    </button>
  </div>
</div>

<script>
const SK = 'dke_settings';
const DK = 'dke_completed';
const FK = 'dke_filter';
const DEFAULTS = {
  r2BaseUrl: 'https://textaudio.ryoxsakai.workers.dev',
  years:  [{ id: 'y1', name: '2026年度', tag: '2026' }],
  terms:  [{ id: 't1', name: '前期', tag: 'term1', lessons: 3 }, { id: 't2', name: '夏期', tag: 'term2', lessons: 2 }],
  levels: [{ id: 'l1', name: 'High 読解', tag: 'high_reading' }, { id: 'l2', name: 'High 構文', tag: 'high_structure' }, { id: 'l3', name: 'Standard 読解', tag: 'standard_reading' }, { id: 'l4', name: 'Standard 構文', tag: 'standard_structure' }]
};

let cfg = null, done = {}, cur = null;
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadDone() { try { done = JSON.parse(localStorage.getItem(DK) || '{}'); } catch { done = {}; } }
function saveDone() { localStorage.setItem(DK, JSON.stringify(done)); }
function mk(yId, tId, lId, n) { return `${yId}_${tId}_${lId}_${n}`; }

async function loadCfg() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(SK)); } catch {}
  const workerUrl = local?.r2WorkerUrl?.replace(/\/$/, '');
  const baseUrl   = (local?.r2BaseUrl || DEFAULTS.r2BaseUrl).replace(/\/$/, '');
  const fetchUrls = [...new Set([workerUrl, baseUrl].filter(Boolean))];
  cfg = {
    r2BaseUrl:    local?.r2BaseUrl    || DEFAULTS.r2BaseUrl,
    r2WorkerUrl:  local?.r2WorkerUrl  || '',
    years:        local?.years?.length  ? local.years  : [...DEFAULTS.years],
    terms:        local?.terms?.length  ? local.terms  : [...DEFAULTS.terms],
    levels:       local?.levels?.length ? local.levels : [...DEFAULTS.levels],
    defaultYear:  local?.defaultYear  || '',
    defaultTerm:  local?.defaultTerm  || '',
    defaultLevel: local?.defaultLevel || '',
    lessonTitles: local?.lessonTitles || {},
    siteTitle:    local?.siteTitle    || localStorage.getItem('dke_site_title') || '',
  };
  for (const url of fetchUrls) {
    try {
      const r = await fetch(`${url}/settings.json`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.years?.length)  cfg.years  = j.years;
      if (j.terms?.length)  cfg.terms  = j.terms;
      if (j.levels?.length) cfg.levels = j.levels;
      if (j.r2BaseUrl   && !local?.r2BaseUrl)   cfg.r2BaseUrl   = j.r2BaseUrl;
      if (j.r2WorkerUrl && !local?.r2WorkerUrl) cfg.r2WorkerUrl = j.r2WorkerUrl;
      if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
      if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
      if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
      if (j.lessonTitles && Object.keys(j.lessonTitles).length) cfg.lessonTitles = j.lessonTitles;
      if (j.siteTitle && !local?.siteTitle) cfg.siteTitle = j.siteTitle;
      break;
    } catch {}
  }
}

function allRows() {
  const rows = [];
  for (const y of cfg.years)
    for (const t of cfg.terms)
      for (const l of cfg.levels)
        for (let n = 1; n <= t.lessons; n++)
          rows.push({ y, t, l, n, key: mk(y.id, t.id, l.id, n) });
  return rows;
}
function audioPath(y, t, l, n) { return `${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`; }
function audioUrl(y, t, l, n) { return `${cfg.r2BaseUrl}/${audioPath(y, t, l, n)}`; }
function audioUrlWorker(y, t, l, n) {
  const base = cfg.r2WorkerUrl || cfg.r2BaseUrl;
  return `${base}/${audioPath(y, t, l, n)}`;
}

function updateBadge() {
  const count = allRows().filter(r => done[r.key]).length;
  document.getElementById('completionBadge').textContent = `完了: ${count}`;
}

function render() {
  const yF = document.getElementById('filterYear').value;
  const tF = document.getElementById('filterTerm').value;
  const lF = document.getElementById('filterLevel').value;
  const rows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  updateBadge();
  const con = document.getElementById('tableContainer');
  if (!rows.length) { con.innerHTML = '<div class="msg-c">該当するコンテンツがありません</div>'; return; }
  let h = '<table><thead><tr><th>講</th><th>タイトル</th><th></th></tr></thead><tbody>';
  for (const r of rows) {
    const d = !!done[r.key];
    const lt = cfg.lessonTitles?.[r.key] || '';
    h += `<tr class="${d ? 'done-row' : ''}">
      <td style="white-space:nowrap;font-weight:600;">第${r.n}講</td>
      <td style="font-size:.82rem;color:var(--muted);">${lt ? esc(lt) : '<span style="color:var(--border)">—</span>'}</td>
      <td class="ops">
        <button class="icon-btn play-btn" id="play-${r.key}" disabled onclick="openPlayer('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})" title="再生"><i class="fas fa-play"></i></button>
      </td>
    </tr>`;
  }
  con.innerHTML = h + '</tbody></table>';
  rows.forEach(r => {
    const enablePlay = () => {
      const btn = document.getElementById(`play-${r.key}`);
      if (btn) btn.disabled = false;
    };
    fetch(audioUrlWorker(r.y, r.t, r.l, r.n), { method: 'HEAD' })
      .then(res => { if (res.ok) enablePlay(); else throw new Error(); })
      .catch(() => {
        const u = audioUrl(r.y, r.t, r.l, r.n);
        if (u !== audioUrlWorker(r.y, r.t, r.l, r.n))
          fetch(u, { method: 'HEAD' }).then(res => { if (res.ok) enablePlay(); }).catch(() => {});
      });
  });
}

function saveFilter() {
  try {
    localStorage.setItem(FK, JSON.stringify({
      year:  document.getElementById('filterYear').value,
      term:  document.getElementById('filterTerm').value,
      level: document.getElementById('filterLevel').value
    }));
  } catch {}
}

function populateFilters() {
  const ySel = document.getElementById('filterYear');
  const tSel = document.getElementById('filterTerm');
  const lSel = document.getElementById('filterLevel');
  const yv = ySel.value, tv = tSel.value, lv = lSel.value;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(FK) || '{}'); } catch {}
  ySel.innerHTML = cfg.years.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
  tSel.innerHTML = cfg.terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  lSel.innerHTML = cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  if (yv) ySel.value = yv;
  else if (saved.year)      ySel.value = saved.year;
  else if (cfg.defaultYear) ySel.value = cfg.defaultYear;
  if (tv) tSel.value = tv;
  else if (saved.term)      tSel.value = saved.term;
  else if (cfg.defaultTerm) tSel.value = cfg.defaultTerm;
  if (lv) lSel.value = lv;
  else if (saved.level)      lSel.value = saved.level;
  else if (cfg.defaultLevel) lSel.value = cfg.defaultLevel;
}

function toggleDone(yId, tId, lId, n) {
  const k = mk(yId, tId, lId, n);
  if (done[k]) delete done[k]; else done[k] = true;
  saveDone(); render();
  if (cur && cur.yId === yId && cur.tId === tId && cur.lId === lId && cur.n === n) refreshMarkBtn();
}

/* ── Player ── */
const audio   = document.getElementById('audio');
const overlay = document.getElementById('overlay');

function fmt(s) { return isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00'; }
function updProg() {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  document.getElementById('progFill').style.width = p + '%';
  document.getElementById('progThumb').style.left = p + '%';
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
}
audio.addEventListener('timeupdate', updProg);
audio.addEventListener('loadedmetadata', () => { document.getElementById('durTime').textContent = fmt(audio.duration); updProg(); });
audio.addEventListener('ended', () => setPI(false));

function setPI(playing) {
  const icon = document.getElementById('iconPlay');
  icon.className = playing ? 'fas fa-pause' : 'fas fa-play';
}
document.getElementById('btnPlay').addEventListener('click', () => {
  if (audio.paused) { audio.play(); setPI(true); } else { audio.pause(); setPI(false); }
});
document.getElementById('btnBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('btnFwd').addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

let seeking = false;
function seekTo(cx) {
  const r = document.getElementById('progWrap').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (cx - r.left) / r.width));
  if (audio.duration) audio.currentTime = p * audio.duration;
  updProg();
}
const pw = document.getElementById('progWrap');
pw.addEventListener('mousedown',  e => { seeking = true; seekTo(e.clientX); });
window.addEventListener('mousemove', e => { if (seeking) seekTo(e.clientX); });
window.addEventListener('mouseup',   () => { seeking = false; });
pw.addEventListener('touchstart', e => { seeking = true; seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (seeking) seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend',  () => { seeking = false; });

function setSpeed(v) {
  audio.playbackRate = v;
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === v));
}
document.querySelectorAll('.btn-preset').forEach(b => b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));

function refreshMarkBtn() {
  if (!cur) return;
  const d = !!done[mk(cur.yId, cur.tId, cur.lId, cur.n)];
  const btn = document.getElementById('btnMarkDone');
  btn.innerHTML = d
    ? '<i class="fas fa-rotate-left"></i><span>完了を取り消す</span>'
    : '<i class="fas fa-check"></i><span>完了にする</span>';
  btn.className = 'btn-mark-done' + (d ? ' is-done' : '');
}
document.getElementById('btnMarkDone').addEventListener('click', () => {
  if (!cur) return;
  toggleDone(cur.yId, cur.tId, cur.lId, cur.n);
  refreshMarkBtn();
});

function openPlayer(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  cur = { yId, tId, lId, n };
  const lessonTitle = cfg.lessonTitles?.[mk(yId, tId, lId, n)] || '';
  const mainLabel = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  document.getElementById('playerTitle').innerHTML = lessonTitle
    ? `${esc(mainLabel)}<br><span style="font-size:.8rem;font-weight:400;color:var(--muted);">${esc(lessonTitle)}</span>`
    : esc(mainLabel);
  audio.src = audioUrlWorker(y, t, l, n);
  audio.currentTime = 0;
  setPI(false);
  document.getElementById('durTime').textContent = '0:00';
  document.getElementById('curTime').textContent = '0:00';
  setSpeed(1);
  refreshMarkBtn();
  overlay.classList.add('open');
}
function closePlayer() { audio.pause(); overlay.classList.remove('open'); cur = null; }
document.getElementById('btnClose').addEventListener('click', closePlayer);
overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });

function handleParams() {
  const p = new URLSearchParams(location.search);
  const yTag = p.get('year'), tTag = p.get('term'), lTag = p.get('level'), n = parseInt(p.get('lesson'), 10);
  if (!yTag || !tTag || !lTag || !n) return;
  const y = cfg.years.find(x => x.tag === yTag);
  const t = cfg.terms.find(x => x.tag === tTag);
  const l = cfg.levels.find(x => x.tag === lTag);
  if (!y || !t || !l || n < 1 || n > t.lessons) return;
  fetch(audioUrlWorker(y, t, l, n), { method: 'HEAD' })
    .then(res => { if (res.ok) openPlayer(y.id, t.id, l.id, n); })
    .catch(() => {});
}

async function init() {
  loadDone();
  try { await loadCfg(); }
  catch { document.getElementById('tableContainer').innerHTML = '<div class="msg-c err">コンテンツを読み込めませんでした</div>'; return; }
  if (cfg.siteTitle) {
    document.getElementById('appTitle').textContent = cfg.siteTitle;
    document.title = cfg.siteTitle;
  }
  populateFilters(); render(); handleParams();
  document.getElementById('filterYear').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterTerm').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterLevel').addEventListener('change', () => { saveFilter(); render(); });
}
init();
</script>
</body>
</html>
