<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DKE Medical English</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #5B8DEF; --primary-dk: #3F73D6; --primary-lt: #EAF1FE;
      --grad: linear-gradient(135deg, #5B8DEF 0%, #8B7FE8 100%);
      --green: #3FB984;   --green-lt:  #E7F7F0;
      --red: #E07A7A;
      --border: #DCE6F4; --bg: #F3F7FC; --text: #28324A; --muted: #95A3BA;
    }
    body { font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── Header ── */
    .app-header { background-color: #6E8FE8; background-image: linear-gradient(120deg, rgba(74,116,222,.32) 0%, rgba(150,124,214,.06) 100%), url('bg.png'); background-size: cover, cover; background-position: center, center 18%; background-repeat: no-repeat, no-repeat; color: #fff; padding: 32px 22px 38px; border-radius: 0 0 28px 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; box-shadow: 0 8px 26px rgba(91,141,239,.3); position: relative; z-index: 5; }
    .app-title { font-size: 1.5rem; font-weight: 700; line-height: 1.25; letter-spacing: .01em; flex: 1; min-width: 0; text-shadow: 0 1px 8px rgba(50,80,160,.25); }

    .ring { position: relative; width: 86px; height: 86px; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .ring .ring-track { stroke: rgba(255,255,255,.28); }
    .ring .ring-fill { stroke: #fff; stroke-dasharray: 238.76; stroke-dashoffset: 238.76; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
    .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
    .ring-pct { font-size: 1.25rem; font-weight: 700; line-height: 1; }
    .ring-lbl { font-size: .62rem; margin-top: 3px; opacity: .92; letter-spacing: .04em; }

    /* ── Filters ── */
    .filters { display: flex; gap: 10px; padding: 18px 16px 4px; flex-wrap: wrap; }
    .pill { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 14px; padding: 0 11px; height: 50px; box-shadow: 0 3px 12px rgba(80,120,200,.08); cursor: pointer; transition: box-shadow .15s; }
    .pill:active { box-shadow: 0 1px 5px rgba(80,120,200,.12); }
    .pill > i:first-child { color: var(--primary); font-size: .9rem; flex-shrink: 0; }
    .pill select { flex: 1; min-width: 0; border: none; background: none; font-size: 1rem; font-weight: 600; color: var(--text); appearance: none; -webkit-appearance: none; cursor: pointer; padding: 0; }
    .pill select:focus { outline: none; }
    .pill-arrow { color: var(--muted); font-size: .68rem; flex-shrink: 0; pointer-events: none; }

    /* ── Section header ── */
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .sh-title { font-size: 1.08rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 9px; }
    .sh-title i { color: var(--primary); }
    .sh-count { font-size: .76rem; font-weight: 600; color: var(--muted); background: #fff; padding: 6px 13px; border-radius: 20px; box-shadow: 0 2px 8px rgba(80,120,200,.08); display: flex; align-items: center; gap: 6px; }
    .sh-count i { color: var(--green); }

    /* ── Lesson cards ── */
    .lesson-list { display: flex; flex-direction: column; gap: 11px; padding: 0 16px 36px; }
    .lesson-card { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: #fff; border: none; border-radius: 16px; padding: 15px 16px; box-shadow: 0 3px 14px rgba(80,120,200,.08); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; position: relative; overflow: hidden; font-family: inherit; }
    .lesson-card:active { transform: scale(.985); box-shadow: 0 1px 6px rgba(80,120,200,.1); }
    .lesson-card.is-done::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--green); }
    .lesson-card:disabled { cursor: default; }
    .lc-num { font-size: .92rem; font-weight: 700; color: var(--text); white-space: nowrap; flex-shrink: 0; }
    .lc-title { flex: 1; min-width: 0; font-size: .88rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lc-title.empty { color: var(--border); font-weight: 400; }
    .lc-status { font-size: .72rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .lc-status.done { color: var(--green); }
    .play-fab { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 12px rgba(91,141,239,.35); }
    .play-fab i { margin-left: 2px; }
    .lesson-card:disabled .play-fab { background: #CFD9E8; box-shadow: none; }
    .lesson-card:disabled .lc-num, .lesson-card:disabled .lc-title { color: var(--muted); }

    .msg-c { text-align: center; padding: 48px 20px; color: var(--muted); font-size: .9rem; }
    .msg-c.err { color: var(--red); }

    /* ── Overlay / Sheet ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(30,45,75,.42); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 92%; max-width: 460px; max-height: 90dvh; background: #fff; border-radius: 24px; padding: 22px 22px 28px; overflow-y: auto; box-shadow: 0 12px 48px rgba(60,90,160,.28); }

    /* ── Player ── */
    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .pl-title { font-size: .92rem; font-weight: 700; color: var(--text); line-height: 1.45; flex: 1; padding-right: 12px; }
    .btn-close { width: 32px; height: 32px; border: none; background: var(--primary-lt); border-radius: 50%; font-size: .85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--primary); }
    .btn-close:active { background: var(--border); }

    .prog-wrap { position: relative; height: 40px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; margin-bottom: 2px; }
    .prog-track { position: absolute; left: 0; right: 0; height: 5px; background: var(--primary-lt); border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0; background: var(--grad); border-radius: 3px; }
    .prog-thumb { position: absolute; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 6px rgba(91,141,239,.45); }
    .time-row { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 18px; }

    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 18px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 46px; min-height: 46px; cursor: pointer; color: var(--primary); font-size: 1.35rem; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    .ctrl-btn:active { background: var(--primary-lt); }
    .ctrl-btn:disabled { color: var(--border); pointer-events: none; }
    .ctrl-btn-main { background: var(--grad); color: #fff; min-width: 64px; min-height: 64px; font-size: 1.5rem; box-shadow: 0 6px 20px rgba(91,141,239,.38); }
    .ctrl-btn-main:active { background: var(--primary-dk); opacity: .92; }

    /* ── Speed presets ── */
    .speed-section { margin-bottom: 18px; }
    .speed-label { font-size: .72rem; color: var(--muted); text-align: center; margin-bottom: 8px; letter-spacing: .04em; }
    .speed-preset-row { display: flex; gap: 6px; justify-content: center; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: var(--muted); font-size: .77rem; font-weight: 600; padding: 6px 10px; border-radius: 20px; cursor: pointer; min-height: 34px; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-preset.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn-preset:active { opacity: .7; }

    /* ── Lesson nav ── */
    .lesson-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
    .lesson-nav .ctrl-btn { min-width: 40px; min-height: 40px; font-size: 1.15rem; }
    .nav-label { font-size: .76rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }

    /* ── Mark done ── */
    .btn-mark-done { width: 100%; height: 48px; border: none; border-radius: 14px; font-size: .9rem; font-weight: 700; cursor: pointer; background: var(--green); color: #fff; -webkit-tap-highlight-color: transparent; transition: opacity .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-mark-done:active { opacity: .8; }
    .btn-mark-done.is-done { background: var(--primary-lt); color: var(--muted); }

    /* ── Mobile tweaks ── */
    @media (max-width: 380px) {
      .filters { gap: 6px; padding: 14px 12px 4px; }
      .pill { padding: 0 8px; gap: 5px; }
      .lesson-list { padding: 0 12px 36px; gap: 9px; }
      .lesson-card { padding: 13px 13px; gap: 10px; }
      .play-fab { width: 38px; height: 38px; font-size: .9rem; }
      .lc-status { display: none; }
      .lc-title { white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title" id="appTitle">DKE Medical English</h1>
  <div class="ring">
    <svg viewBox="0 0 84 84">
      <circle class="ring-track" cx="42" cy="42" r="38"/>
      <circle class="ring-fill" id="ringFill" cx="42" cy="42" r="38"/>
    </svg>
    <div class="ring-text">
      <span class="ring-pct" id="progPct">0%</span>
      <span class="ring-lbl">完了率</span>
    </div>
  </div>
</header>
<script>
(function(){
  try {
    const t = localStorage.getItem('dke_site_title') ||
              (JSON.parse(localStorage.getItem('dke_settings')||'{}') || {}).siteTitle || '';
    if (t) { document.getElementById('appTitle').textContent = t; document.title = t; }
  } catch(e) {}
})();
</script>

<div class="filters">
  <select id="filterYear" hidden></select>
  <label class="pill" style="flex:1 1 0"><i class="fas fa-clock"></i><select id="filterTerm"></select><i class="fas fa-chevron-down pill-arrow"></i></label>
  <label class="pill" style="flex:3 1 0"><i class="fas fa-signal"></i><select id="filterLevel"></select><i class="fas fa-chevron-down pill-arrow"></i></label>
</div>

<div class="section-head">
  <span class="sh-title"><i class="fas fa-headphones"></i> 講義一覧</span>
  <span class="sh-count" id="completionBadge"><i class="fas fa-circle-check"></i> 完了 0</span>
</div>

<div class="lesson-list" id="tableContainer"><div class="msg-c">読み込み中…</div></div>

<!-- Player modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose"><i class="fas fa-xmark"></i></button>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack" title="10秒戻る"><i class="fas fa-rotate-left"></i></button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay"><i class="fas fa-play" id="iconPlay"></i></button>
      <button class="ctrl-btn" id="btnFwd" title="10秒進む"><i class="fas fa-rotate-right"></i></button>
    </div>
    <div class="speed-section">
      <div class="speed-label">再生速度</div>
      <div class="speed-preset-row">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
        <button class="btn-preset" data-speed="2">2.0x</button>
      </div>
    </div>
    <div class="lesson-nav">
      <button class="ctrl-btn" id="btnPrevLesson" title="前の講" disabled><i class="fas fa-backward-step"></i></button>
      <span class="nav-label" id="navLabel"></span>
      <button class="ctrl-btn" id="btnNextLesson" title="次の講" disabled><i class="fas fa-forward-step"></i></button>
    </div>
    <button class="btn-mark-done" id="btnMarkDone">
      <i class="fas fa-check"></i><span>完了にする</span>
    </button>
  </div>
</div>

<script>
const SK = 'dke_settings';
const DK = 'dke_completed';
const FK = 'dke_filter';
const DEFAULTS = {
  r2BaseUrl: 'https://textaudio.ryoxsakai.workers.dev',
  years:  [{ id: 'y1', name: '2026年度', tag: '2026' }],
  terms:  [{ id: 't1', name: '前期', tag: 'term1', lessons: 3 }, { id: 't2', name: '夏期', tag: 'term2', lessons: 2 }],
  levels: [{ id: 'l1', name: 'High 読解', tag: 'high_reading' }, { id: 'l2', name: 'High 構文', tag: 'high_structure' }, { id: 'l3', name: 'Standard 読解', tag: 'standard_reading' }, { id: 'l4', name: 'Standard 構文', tag: 'standard_structure' }]
};

let cfg = null, done = {}, cur = null, currentRows = [];
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadDone() { try { done = JSON.parse(localStorage.getItem(DK) || '{}'); } catch { done = {}; } }
function saveDone() { localStorage.setItem(DK, JSON.stringify(done)); }
function mk(yId, tId, lId, n) { return `${yId}_${tId}_${lId}_${n}`; }

async function loadCfg() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(SK)); } catch {}
  const workerUrl = local?.r2WorkerUrl?.replace(/\/$/, '');
  const baseUrl   = (local?.r2BaseUrl || DEFAULTS.r2BaseUrl).replace(/\/$/, '');
  const fetchUrls = [...new Set([workerUrl, baseUrl].filter(Boolean))];
  cfg = {
    r2BaseUrl:    local?.r2BaseUrl    || DEFAULTS.r2BaseUrl,
    r2WorkerUrl:  local?.r2WorkerUrl  || '',
    years:        local?.years?.length  ? local.years  : [...DEFAULTS.years],
    terms:        local?.terms?.length  ? local.terms  : [...DEFAULTS.terms],
    levels:       local?.levels?.length ? local.levels : [...DEFAULTS.levels],
    defaultYear:  local?.defaultYear  || '',
    defaultTerm:  local?.defaultTerm  || '',
    defaultLevel: local?.defaultLevel || '',
    lessonTitles: local?.lessonTitles || {},
    siteTitle:    local?.siteTitle    || localStorage.getItem('dke_site_title') || '',
  };
  for (const url of fetchUrls) {
    try {
      const r = await fetch(`${url}/settings.json`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.years?.length)  cfg.years  = j.years;
      if (j.terms?.length)  cfg.terms  = j.terms;
      if (j.levels?.length) cfg.levels = j.levels;
      if (j.r2BaseUrl   && !local?.r2BaseUrl)   cfg.r2BaseUrl   = j.r2BaseUrl;
      if (j.r2WorkerUrl && !local?.r2WorkerUrl) cfg.r2WorkerUrl = j.r2WorkerUrl;
      if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
      if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
      if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
      if (j.lessonTitles && Object.keys(j.lessonTitles).length) cfg.lessonTitles = j.lessonTitles;
      if (j.siteTitle && !local?.siteTitle) cfg.siteTitle = j.siteTitle;
      break;
    } catch {}
  }
}

function allRows() {
  const rows = [];
  for (const y of cfg.years)
    for (const t of cfg.terms)
      for (const l of cfg.levels)
        for (let n = 1; n <= t.lessons; n++)
          rows.push({ y, t, l, n, key: mk(y.id, t.id, l.id, n) });
  return rows;
}
function audioPath(y, t, l, n) { return `${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`; }
function audioUrl(y, t, l, n) { return `${cfg.r2BaseUrl}/${audioPath(y, t, l, n)}`; }
function audioUrlWorker(y, t, l, n) {
  const base = cfg.r2WorkerUrl || cfg.r2BaseUrl;
  return `${base}/${audioPath(y, t, l, n)}`;
}

const RING_CIRC = 238.76;
function updateProgress(rows) {
  const total = rows.length;
  const cnt = rows.filter(r => done[r.key]).length;
  const pct = total ? Math.round(cnt / total * 100) : 0;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('ringFill').style.strokeDashoffset = RING_CIRC * (1 - pct / 100);
  document.getElementById('completionBadge').innerHTML = `<i class="fas fa-circle-check"></i> 完了 ${cnt}`;
}

function render() {
  const yF = document.getElementById('filterYear').value;
  const tF = document.getElementById('filterTerm').value;
  const lF = document.getElementById('filterLevel').value;
  const rows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  updateProgress(rows);
  const con = document.getElementById('tableContainer');
  if (!rows.length) { con.innerHTML = '<div class="msg-c">該当するコンテンツがありません</div>'; return; }
  let h = '';
  for (const r of rows) {
    const d = !!done[r.key];
    const lt = cfg.lessonTitles?.[r.key] || '';
    const status = d ? '<i class="fas fa-circle-check"></i> 完了' : '未再生';
    h += `<button class="lesson-card${d ? ' is-done' : ''}" id="card-${r.key}" disabled onclick="openPlayer('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})">
      <span class="lc-num">第${r.n}講</span>
      <span class="lc-title${lt ? '' : ' empty'}">${lt ? esc(lt) : 'タイトル未設定'}</span>
      <span class="lc-status${d ? ' done' : ''}">${status}</span>
      <span class="play-fab"><i class="fas fa-play"></i></span>
    </button>`;
  }
  con.innerHTML = h;
  rows.forEach(r => {
    const enablePlay = () => {
      const btn = document.getElementById(`card-${r.key}`);
      if (btn) btn.disabled = false;
    };
    fetch(audioUrlWorker(r.y, r.t, r.l, r.n), { method: 'HEAD' })
      .then(res => { if (res.ok) enablePlay(); else throw new Error(); })
      .catch(() => {
        const u = audioUrl(r.y, r.t, r.l, r.n);
        if (u !== audioUrlWorker(r.y, r.t, r.l, r.n))
          fetch(u, { method: 'HEAD' }).then(res => { if (res.ok) enablePlay(); }).catch(() => {});
      });
  });
}

function saveFilter() {
  try {
    localStorage.setItem(FK, JSON.stringify({
      year:  document.getElementById('filterYear').value,
      term:  document.getElementById('filterTerm').value,
      level: document.getElementById('filterLevel').value
    }));
  } catch {}
}

function populateFilters() {
  const ySel = document.getElementById('filterYear');
  const tSel = document.getElementById('filterTerm');
  const lSel = document.getElementById('filterLevel');
  const yv = ySel.value, tv = tSel.value, lv = lSel.value;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(FK) || '{}'); } catch {}
  ySel.innerHTML = cfg.years.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
  tSel.innerHTML = cfg.terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  lSel.innerHTML = cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  // URL params (from QR code) take priority over localStorage
  const p = new URLSearchParams(location.search);
  const uy = cfg.years.find(x => x.tag === p.get('year'));
  const ut = cfg.terms.find(x => x.tag === p.get('term'));
  const ul = cfg.levels.find(x => x.tag === p.get('level'));
  if (uy)                    ySel.value = uy.id;
  else if (yv)               ySel.value = yv;
  else if (saved.year)       ySel.value = saved.year;
  else if (cfg.defaultYear)  ySel.value = cfg.defaultYear;
  if (ut)                    tSel.value = ut.id;
  else if (tv)               tSel.value = tv;
  else if (saved.term)       tSel.value = saved.term;
  else if (cfg.defaultTerm)  tSel.value = cfg.defaultTerm;
  if (ul)                    lSel.value = ul.id;
  else if (lv)               lSel.value = lv;
  else if (saved.level)      lSel.value = saved.level;
  else if (cfg.defaultLevel) lSel.value = cfg.defaultLevel;
}

function toggleDone(yId, tId, lId, n) {
  const k = mk(yId, tId, lId, n);
  if (done[k]) delete done[k]; else done[k] = true;
  saveDone(); render();
  if (cur && cur.yId === yId && cur.tId === tId && cur.lId === lId && cur.n === n) refreshMarkBtn();
}

/* ── Player ── */
const audio   = document.getElementById('audio');
const overlay = document.getElementById('overlay');

function fmt(s) { return isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00'; }
function updProg() {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  document.getElementById('progFill').style.width = p + '%';
  document.getElementById('progThumb').style.left = p + '%';
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
}
audio.addEventListener('timeupdate', updProg);
audio.addEventListener('loadedmetadata', () => { document.getElementById('durTime').textContent = fmt(audio.duration); updProg(); });
audio.addEventListener('ended', () => setPI(false));

function setPI(playing) {
  const icon = document.getElementById('iconPlay');
  icon.className = playing ? 'fas fa-pause' : 'fas fa-play';
}
document.getElementById('btnPlay').addEventListener('click', () => {
  if (audio.paused) { audio.play(); setPI(true); } else { audio.pause(); setPI(false); }
});
document.getElementById('btnBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('btnFwd').addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

let seeking = false;
function seekTo(cx) {
  const r = document.getElementById('progWrap').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (cx - r.left) / r.width));
  if (audio.duration) audio.currentTime = p * audio.duration;
  updProg();
}
const pw = document.getElementById('progWrap');
pw.addEventListener('mousedown',  e => { seeking = true; seekTo(e.clientX); });
window.addEventListener('mousemove', e => { if (seeking) seekTo(e.clientX); });
window.addEventListener('mouseup',   () => { seeking = false; });
pw.addEventListener('touchstart', e => { seeking = true; seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (seeking) seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend',  () => { seeking = false; });

function setSpeed(v) {
  audio.playbackRate = v;
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === v));
}
document.querySelectorAll('.btn-preset').forEach(b => b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));

function refreshMarkBtn() {
  if (!cur) return;
  const d = !!done[mk(cur.yId, cur.tId, cur.lId, cur.n)];
  const btn = document.getElementById('btnMarkDone');
  btn.innerHTML = d
    ? '<i class="fas fa-rotate-left"></i><span>完了を取り消す</span>'
    : '<i class="fas fa-check"></i><span>完了にする</span>';
  btn.className = 'btn-mark-done' + (d ? ' is-done' : '');
}
document.getElementById('btnMarkDone').addEventListener('click', () => {
  if (!cur) return;
  toggleDone(cur.yId, cur.tId, cur.lId, cur.n);
  refreshMarkBtn();
});

function openPlayer(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  cur = { yId, tId, lId, n };
  const yF = document.getElementById('filterYear').value;
  const tF = document.getElementById('filterTerm').value;
  const lF = document.getElementById('filterLevel').value;
  currentRows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  updateNavButtons();
  const lessonTitle = cfg.lessonTitles?.[mk(yId, tId, lId, n)] || '';
  const mainLabel = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  document.getElementById('playerTitle').innerHTML = lessonTitle
    ? `${esc(mainLabel)}<br><span style="font-size:.8rem;font-weight:400;color:var(--muted);">${esc(lessonTitle)}</span>`
    : esc(mainLabel);
  audio.src = audioUrlWorker(y, t, l, n);
  audio.currentTime = 0;
  setPI(false);
  document.getElementById('durTime').textContent = '0:00';
  document.getElementById('curTime').textContent = '0:00';
  setSpeed(1);
  refreshMarkBtn();
  overlay.classList.add('open');
}
function closePlayer() { audio.pause(); overlay.classList.remove('open'); cur = null; }
document.getElementById('btnClose').addEventListener('click', closePlayer);

function getCurIdx() {
  if (!cur) return -1;
  return currentRows.findIndex(r => r.y.id === cur.yId && r.t.id === cur.tId && r.l.id === cur.lId && r.n === cur.n);
}
function updateNavButtons() {
  const idx = getCurIdx();
  const total = currentRows.length;
  const btnP = document.getElementById('btnPrevLesson');
  const btnN = document.getElementById('btnNextLesson');
  if (btnP) btnP.disabled = idx <= 0;
  if (btnN) btnN.disabled = idx < 0 || idx >= total - 1;
  const lbl = document.getElementById('navLabel');
  if (lbl) lbl.textContent = total > 1 ? `${idx + 1} / ${total}` : '';
}
document.getElementById('btnPrevLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx > 0) { const r = currentRows[idx - 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
document.getElementById('btnNextLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx >= 0 && idx < currentRows.length - 1) { const r = currentRows[idx + 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });

function handleParams() {
  const p = new URLSearchParams(location.search);
  const yTag = p.get('year'), tTag = p.get('term'), lTag = p.get('level'), n = parseInt(p.get('lesson'), 10);
  if (!yTag || !tTag || !lTag || !n) return;
  const y = cfg.years.find(x => x.tag === yTag);
  const t = cfg.terms.find(x => x.tag === tTag);
  const l = cfg.levels.find(x => x.tag === lTag);
  if (!y || !t || !l || n < 1 || n > t.lessons) return;
  fetch(audioUrlWorker(y, t, l, n), { method: 'HEAD' })
    .then(res => { if (res.ok) openPlayer(y.id, t.id, l.id, n); })
    .catch(() => {});
}

async function init() {
  loadDone();
  try { await loadCfg(); }
  catch { document.getElementById('tableContainer').innerHTML = '<div class="msg-c err">コンテンツを読み込めませんでした</div>'; return; }
  if (cfg.siteTitle) {
    document.getElementById('appTitle').textContent = cfg.siteTitle;
    document.title = cfg.siteTitle;
  }
  populateFilters(); render(); handleParams();
  document.getElementById('filterYear').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterTerm').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterLevel').addEventListener('change', () => { saveFilter(); render(); });
}
init();
</script>
</body>
</html>
