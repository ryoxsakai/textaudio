<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DKE Medical English</title>
  <link rel="apple-touch-icon" href="icon1.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #5B8DEF; --primary-dk: #3F73D6; --primary-lt: #EAF1FE;
      --grad: linear-gradient(135deg, #5B8DEF 0%, #8B7FE8 100%);
      --green: #3FB984;   --green-lt:  #E7F7F0;
      --red: #E07A7A;
      --border: #DCE6F4; --bg: #F3F7FC; --text: #28324A; --muted: #95A3BA;
    }
    body { font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

    /* ── Header ── */
    .app-header { background-color: #6E8FE8; background-image: linear-gradient(120deg, rgba(74,116,222,.32) 0%, rgba(150,124,214,.06) 100%), url('bg.png'); background-size: cover, cover; background-position: center, center 18%; background-repeat: no-repeat, no-repeat; color: #fff; padding: 32px 22px 38px; border-radius: 0 0 28px 28px; display: flex; align-items: center; justify-content: space-between; gap: 18px; box-shadow: 0 8px 26px rgba(91,141,239,.3); position: relative; z-index: 5; }
    .app-title { font-size: 1.5rem; font-weight: 700; line-height: 1.25; letter-spacing: .01em; flex: 1; min-width: 0; text-shadow: 0 1px 8px rgba(50,80,160,.25); }

    .ring { position: relative; width: 86px; height: 86px; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
    .ring .ring-track { stroke: rgba(255,255,255,.28); }
    .ring .ring-fill { stroke: #fff; stroke-dasharray: 238.76; stroke-dashoffset: 238.76; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
    .ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
    .ring-pct { font-size: 1.25rem; font-weight: 700; line-height: 1; }
    .ring-lbl { font-size: .62rem; margin-top: 3px; opacity: .92; letter-spacing: .04em; }

    /* ── Filters ── */
    .filters { display: flex; gap: 10px; padding: 18px 16px 4px; flex-wrap: wrap; }
    .pill { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 7px; background: #fff; border-radius: 14px; padding: 0 11px; height: 50px; box-shadow: 0 3px 12px rgba(80,120,200,.08); cursor: pointer; transition: box-shadow .15s; }
    .pill:active { box-shadow: 0 1px 5px rgba(80,120,200,.12); }
    .pill > i:first-child { color: var(--primary); font-size: .9rem; flex-shrink: 0; }
    .pill select { flex: 1; min-width: 0; border: none; background: none; font-size: 1rem; font-weight: 600; color: var(--text); appearance: none; -webkit-appearance: none; cursor: pointer; padding: 0; }
    .pill select:focus { outline: none; }
    .pill-arrow { color: var(--muted); font-size: .68rem; flex-shrink: 0; pointer-events: none; }

    /* ── Section header ── */
    .section-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .sh-title { font-size: 1.08rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 9px; }
    .sh-title i { color: var(--primary); }
    .sh-count { font-size: .76rem; font-weight: 600; color: var(--muted); background: #fff; padding: 6px 13px; border-radius: 20px; box-shadow: 0 2px 8px rgba(80,120,200,.08); display: flex; align-items: center; gap: 6px; }
    .sh-count i { color: var(--green); }
    .sh-count.filter-done   { background: var(--green-lt); color: #2A8A68; }
    .sh-count.filter-done i { color: #2A8A68; }
    .sh-count.filter-undone   { background: #FCEDF0; color: #C05060; }
    .sh-count.filter-undone i { color: #C05060; }
    .sh-count.filter-dl   { background: var(--primary-lt); color: var(--primary); }
    .sh-count.filter-dl i { color: var(--primary); }
    .lc-dl { color: var(--primary); font-size: .65rem; }

    /* ── Lesson cards ── */
    .lesson-list { display: flex; flex-direction: column; gap: 11px; padding: 0 16px 36px; }
    .lesson-card { display: flex; align-items: center; gap: 13px; width: 100%; text-align: left; background: #fff; border: none; border-radius: 16px; padding: 15px 16px; box-shadow: 0 3px 14px rgba(80,120,200,.08); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .12s, box-shadow .12s; position: relative; overflow: hidden; font-family: inherit; }
    .lesson-card:active { transform: scale(.985); box-shadow: 0 1px 6px rgba(80,120,200,.1); }
    .lesson-card.is-done::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--green); }
    .lesson-card:disabled { cursor: default; }
    .lc-num { font-size: .92rem; font-weight: 700; color: var(--text); white-space: nowrap; flex-shrink: 0; }
    .lc-title { flex: 1; min-width: 0; font-size: .88rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lc-title.empty { color: var(--border); font-weight: 400; }
    .lc-status { font-size: .72rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; color: var(--muted); display: flex; align-items: center; gap: 4px; }
    .lc-status.done { color: var(--green); }
    .play-fab { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 4px 12px rgba(91,141,239,.35); }
    .play-fab i { margin-left: 2px; }
    .lesson-card:disabled .play-fab { background: #CFD9E8; box-shadow: none; }
    .lesson-card:disabled .lc-num, .lesson-card:disabled .lc-title { color: var(--muted); }

    .msg-c { text-align: center; padding: 48px 20px; color: var(--muted); font-size: .9rem; }
    .msg-c.err { color: var(--red); }

    /* ── Overlay / Sheet ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(30,45,75,.42); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 92%; max-width: 460px; max-height: 90dvh; background: #fff; border-radius: 24px; padding: 22px 22px 28px; overflow-y: auto; box-shadow: 0 12px 48px rgba(60,90,160,.28); }

    /* ── History ── */
    .hist-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); }
    .hist-row:last-child { border-bottom:none; }
    .hist-date { font-size:.88rem; color:var(--text); white-space:nowrap; min-width:100px; }
    .hist-date.today { font-weight:700; color:var(--primary); }
    .hist-bar { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
    .hist-bar-fill { height:100%; background:var(--grad); border-radius:3px; }
    .hist-time { font-size:.9rem; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; }

    /* ── Player ── */
    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .pl-title { font-size: .92rem; font-weight: 700; color: var(--text); line-height: 1.45; flex: 1; padding-right: 12px; }
    .btn-close { width: 32px; height: 32px; border: none; background: var(--primary-lt); border-radius: 50%; font-size: .85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--primary); }
    .btn-close:active { background: var(--border); }

    .prog-wrap { position: relative; height: 44px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; margin-bottom: 2px; }
    .wave-canvas { position: absolute; left: 0; width: 100%; height: 38px; top: 50%; transform: translateY(-50%); border-radius: 8px; background: var(--primary-lt); pointer-events: none; display: block; }
    .prog-thumb { position: absolute; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 6px rgba(91,141,239,.45); z-index: 2; }
    .time-row { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 18px; }

    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 28px; margin-bottom: 18px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 46px; min-height: 46px; cursor: pointer; color: var(--primary); font-size: 1.35rem; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    .ctrl-btn:active { background: var(--primary-lt); }
    .ctrl-btn:disabled { color: var(--border); pointer-events: none; }
    .ctrl-btn-main { background: var(--grad); color: #fff; min-width: 64px; min-height: 64px; font-size: 1.5rem; box-shadow: 0 6px 20px rgba(91,141,239,.38); }
    .ctrl-btn-main:active { background: var(--primary-dk); opacity: .92; }

    /* ── Speed presets ── */
    .speed-section { margin-bottom: 18px; }
    .speed-label { font-size: .72rem; color: var(--muted); text-align: center; margin-bottom: 8px; letter-spacing: .04em; }
    .speed-preset-row { display: flex; gap: 6px; justify-content: center; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: var(--muted); font-size: .77rem; font-weight: 600; padding: 6px 10px; border-radius: 20px; cursor: pointer; min-height: 34px; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-preset.active { border-color: transparent; background: var(--grad); color: #fff; }
    .btn-preset:active { opacity: .7; }

    /* ── Speed slider ── */
    .speed-range-wrap { padding: 6px 4px 2px; }
    .speed-range { width: 100%; height: 4px; appearance: none; -webkit-appearance: none; border-radius: 2px; outline: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .speed-range::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; background: var(--grad); border-radius: 50%; box-shadow: 0 2px 8px rgba(91,141,239,.4); cursor: pointer; }
    .speed-range::-moz-range-thumb { width: 24px; height: 24px; background: var(--primary); border-radius: 50%; border: none; box-shadow: 0 2px 8px rgba(91,141,239,.4); cursor: pointer; }

    /* ── Lesson nav ── */
    .lesson-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
    .lesson-nav .ctrl-btn { min-width: 40px; min-height: 40px; font-size: 1.15rem; }
    .nav-label { font-size: .76rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; }

    /* ── Visualizer ── */
    #vizCanvas { width: 100%; height: 68px; display: block; border-radius: 10px; background: var(--primary-lt); margin-bottom: 16px; }

    /* ── Mark done ── */
    .mark-done-row { display: flex; gap: 8px; align-items: stretch; }
    .btn-mark-done { flex: 1; height: 48px; border: none; border-radius: 14px; font-size: .9rem; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #3FB984 0%, #28B890 100%); color: #fff; -webkit-tap-highlight-color: transparent; transition: opacity .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-mark-done:active { opacity: .8; }
    .btn-mark-done.is-done { background: linear-gradient(135deg, #EAF1FE 0%, #EDE8FD 100%); color: var(--muted); }
    .btn-cache { width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 14px; background: var(--primary-lt); color: var(--primary); font-size: 1rem; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-cache:active { opacity: .75; }
    .btn-cache.cached { background: var(--green-lt); color: var(--green); }
    .btn-trans { width: 42px; height: 48px; flex-shrink: 0; border: none; border-radius: 14px; background: var(--green-lt); color: var(--green); font-size: .95rem; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-trans:active { opacity: .75; }
    .btn-trans:disabled { background: #EEF1F6; color: #C2CBD9; pointer-events: none; }
    .btn-ico-lbl { font-size: .5rem; font-weight: 700; line-height: 1; letter-spacing: .02em; }

    /* ── Translation modal ── */
    .trans-sheet { display: flex; flex-direction: column; max-height: 90dvh; overflow: hidden; }
    .trans-head { flex-shrink: 0; align-items: center; margin-bottom: 0; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .trans-scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 16px; }
    .trans-tabs { display: flex; gap: 8px; }
    .trans-head-actions { display: flex; align-items: center; gap: 8px; }
    .trans-font-btn { height: 32px; min-width: 32px; padding: 0 9px; border: none; background: var(--primary-lt); border-radius: 16px; color: var(--primary); font-size: .8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 3px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    .trans-font-btn:active { background: var(--border); }
    .trans-font-btn span { font-size: .72rem; line-height: 1; }
    .trans-tab { border: none; background: var(--primary-lt); color: var(--primary); font-weight: 700; font-size: .85rem; padding: 7px 18px; border-radius: 20px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .trans-tab.active { background: var(--grad); color: #fff; }
    .trans-tab:active { opacity: .8; }
    .trans-tab:disabled { opacity: .4; pointer-events: none; }
    .trans-body { white-space: normal; word-break: break-word; font-size: .92rem; line-height: 1.85; color: var(--text); text-align: justify; user-select: text; -webkit-user-select: text; }
    .trans-body.indent .tr-para { text-indent: 2em; }
    .trans-body.indent .tr-para.tr-flush { text-indent: 0; }

    /* ── Mobile tweaks ── */
    @media (max-width: 380px) {
      .filters { gap: 6px; padding: 14px 12px 4px; }
      .pill { padding: 0 8px; gap: 5px; }
      .lesson-list { padding: 0 12px 36px; gap: 9px; }
      .lesson-card { padding: 13px 13px; gap: 10px; }
      .play-fab { width: 38px; height: 38px; font-size: .9rem; }
      .lc-status { display: none; }
      .lc-title { white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title" id="appTitle">DKE Medical English</h1>
  <div class="ring">
    <svg viewBox="0 0 84 84">
      <circle class="ring-track" cx="42" cy="42" r="38"/>
      <circle class="ring-fill" id="ringFill" cx="42" cy="42" r="38"/>
    </svg>
    <div class="ring-text">
      <span class="ring-pct" id="progPct">0%</span>
      <span class="ring-lbl">完了率</span>
    </div>
  </div>
</header>
<script>
(function(){
  try {
    const t = localStorage.getItem('dke_site_title') ||
              (JSON.parse(localStorage.getItem('dke_settings')||'{}') || {}).siteTitle || '';
    if (t) { document.getElementById('appTitle').textContent = t; document.title = t; }
  } catch(e) {}
})();
</script>

<div class="filters">
  <select id="filterYear" hidden></select>
  <label class="pill" style="flex:1 1 0"><i class="fas fa-clock"></i><select id="filterTerm"></select><i class="fas fa-chevron-down pill-arrow"></i></label>
  <label class="pill" style="flex:3 1 0"><i class="fas fa-signal"></i><select id="filterLevel"></select><i class="fas fa-chevron-down pill-arrow"></i></label>
</div>

<div class="section-head">
  <span class="sh-title"><i class="fas fa-headphones"></i> 講義一覧</span>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="sh-count" id="dailyTimeBadge" onclick="openHistory()" style="cursor:pointer"><i class="fas fa-clock" style="color:var(--primary)"></i> <span id="dailyTimeText">00:00:00</span></span>
    <span class="sh-count" id="completionBadge" onclick="cycleCompletionFilter()" style="cursor:pointer"><i class="fas fa-circle-check"></i> 完了 0</span>
    <span class="sh-count" id="dlBadge" onclick="toggleDlFilter()" style="cursor:pointer"><i class="fas fa-download"></i> <span id="dlBadgeCount">0</span></span>
  </div>
</div>

<div class="lesson-list" id="tableContainer"><div class="msg-c">読み込み中…</div></div>

<!-- Translation modal -->
<div class="overlay" id="transOverlay" style="z-index:210">
  <div class="sheet trans-sheet">
    <div class="pl-header trans-head">
      <div class="trans-tabs">
        <button class="trans-tab active" id="transTabTrans" data-tab="trans">和訳</button>
        <button class="trans-tab" id="transTabAnswer" data-tab="answer">解答</button>
      </div>
      <div class="trans-head-actions">
        <button class="trans-font-btn" id="btnTransFont" title="文字サイズを変更"><i class="fas fa-text-height"></i><span id="transFontLvl">2</span></button>
        <button class="btn-close" id="btnTransClose"><i class="fas fa-xmark"></i></button>
      </div>
    </div>
    <div class="trans-scroll"><div class="trans-body" id="transBody"></div></div>
  </div>
</div>

<!-- History modal -->
<div class="overlay" id="historyOverlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title"><i class="fas fa-clock" style="color:var(--primary);margin-right:8px"></i>リスニング履歴（過去30日）</div>
      <button class="btn-close" id="btnHistoryClose"><i class="fas fa-xmark"></i></button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Player modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose"><i class="fas fa-xmark"></i></button>
    </div>
    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <div class="prog-wrap" id="progWrap">
      <canvas id="waveCanvas" class="wave-canvas"></canvas>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <canvas id="vizCanvas"></canvas>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack" title="10秒戻る"><i class="fas fa-rotate-left"></i></button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay"><i class="fas fa-play" id="iconPlay"></i></button>
      <button class="ctrl-btn" id="btnFwd" title="10秒進む"><i class="fas fa-rotate-right"></i></button>
    </div>
    <div class="speed-section" id="speedSection">
      <div class="speed-label">再生速度</div>
      <div class="speed-preset-row" id="speedPresetRow">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
        <button class="btn-preset" data-speed="2">2.0x</button>
      </div>
    </div>
    <div id="speedAltProg" style="display:none;margin-bottom:18px">
      <div class="speed-label">再生速度 <span id="speedSliderVal">1.0x</span></div>
      <div class="speed-range-wrap">
        <input type="range" id="speedRangeInput" class="speed-range" min="0.5" max="2.5" step="0.05" value="1">
      </div>
    </div>
    <div class="lesson-nav">
      <button class="ctrl-btn" id="btnPrevLesson" title="前の講" disabled><i class="fas fa-backward-step"></i></button>
      <span class="nav-label" id="navLabel"></span>
      <button class="ctrl-btn" id="btnNextLesson" title="次の講" disabled><i class="fas fa-forward-step"></i></button>
    </div>
    <div class="mark-done-row">
      <button class="btn-mark-done" id="btnMarkDone">
        <i class="fas fa-check"></i><span>完了にする</span>
      </button>
      <button class="btn-trans" id="btnTrans" title="和訳" disabled>
        <i class="fas fa-language"></i><span class="btn-ico-lbl">訳解</span>
      </button>
      <button class="btn-cache" id="btnCache" title="オフライン保存">
        <i class="fas fa-download" id="iconCache"></i><span class="btn-ico-lbl">DL</span>
      </button>
    </div>
  </div>
</div>

<script>
/* ── IndexedDB audio cache ── */
const IDB_NAME = 'dke_audio', IDB_STORE = 'blobs', IDB_VER = 1;
function openIDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, IDB_VER);
    r.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    r.onsuccess = e => res(e.target.result);
    r.onerror = rej;
  });
}
async function idbGet(key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = e => res(e.target.result ?? null);
    r.onerror = rej;
    tx.oncomplete = () => db.close();
  });
}
async function idbPut(key, blob) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');

// Driven by the decoded PCM buffer synced to playback time, so it works
// on iOS Safari where createMediaElementSource feeds the analyser only
// zeros. The bottom canvas shows a live frequency spectrum.
const VIZ_BARS = 40, FFT_N = 512;
let vizRaf = null, vizSmooth = new Float32Array(VIZ_BARS), vizPeak = 0.0001;

function resizeVizCanvas() {
  const c = document.getElementById('vizCanvas');
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  c.width  = c.clientWidth  * dpr;
  c.height = c.clientHeight * dpr;
}

// In-place iterative radix-2 FFT
function fftMag(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { const tr = re[i]; re[i] = re[j]; re[j] = tr; const ti = im[i]; im[i] = im[j]; im[j] = ti; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wre = Math.cos(ang), wim = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cre = 1, cim = 0;
      for (let k = 0; k < len >> 1; k++) {
        const a = i + k, b = a + (len >> 1);
        const tre = re[b] * cre - im[b] * cim;
        const tim = re[b] * cim + im[b] * cre;
        re[b] = re[a] - tre; im[b] = im[a] - tim;
        re[a] += tre; im[a] += tim;
        const ncre = cre * wre - cim * wim;
        cim = cre * wim + cim * wre; cre = ncre;
      }
    }
  }
}

function drawViz() {
  const c = document.getElementById('vizCanvas');
  if (!c) { vizRaf = null; return; }
  const dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  const ctx2 = c.getContext('2d');
  ctx2.clearRect(0, 0, c.width, c.height);
  ctx2.save();
  ctx2.scale(dpr, dpr);

  const mags = new Float32Array(VIZ_BARS);
  if (currentPCM && audio.duration && !audio.paused) {
    const re = new Float32Array(FFT_N), im = new Float32Array(FFT_N);
    const start = Math.floor(audio.currentTime * currentPCM.sampleRate);
    const d = currentPCM.data;
    for (let i = 0; i < FFT_N; i++) {
      const s = d[start + i] || 0;
      const w = 0.5 * (1 - Math.cos(2 * Math.PI * i / (FFT_N - 1))); // Hann
      re[i] = s * w;
    }
    fftMag(re, im);
    const halfN = FFT_N >> 1;
    // Group bins into bars on a roughly log scale (emphasize low/mid freqs)
    let frameMax = 0;
    for (let b = 0; b < VIZ_BARS; b++) {
      const lo = Math.floor(Math.pow(b / VIZ_BARS, 1.6) * halfN);
      const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / VIZ_BARS, 1.6) * halfN));
      let sum = 0, cnt = 0;
      for (let k = lo; k < hi && k < halfN; k++) {
        sum += Math.sqrt(re[k] * re[k] + im[k] * im[k]); cnt++;
      }
      const v = cnt ? sum / cnt : 0;
      mags[b] = v;
      if (v > frameMax) frameMax = v;
    }
    vizPeak = Math.max(vizPeak * 0.96, frameMax, 0.0001);
  }

  const usableH = H - 4;
  const gap = 3, barW = (W - gap * (VIZ_BARS - 1)) / VIZ_BARS;
  const grad = ctx2.createLinearGradient(0, H, W, 0);
  grad.addColorStop(0,   '#4A7AE0');
  grad.addColorStop(0.5, '#8B7FE8');
  grad.addColorStop(1,   '#C490F5');
  ctx2.fillStyle = grad;

  for (let i = 0; i < VIZ_BARS; i++) {
    const target = Math.min(1, mags[i] / vizPeak);
    vizSmooth[i] += (target - vizSmooth[i]) * 0.35;
    const barH = Math.max(3, vizSmooth[i] * usableH);
    const x = i * (barW + gap), y = H - barH, r = Math.min(3, barW / 2);
    ctx2.beginPath();
    ctx2.moveTo(x + r, y);
    ctx2.lineTo(x + barW - r, y);
    ctx2.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx2.lineTo(x + barW, y + barH);
    ctx2.lineTo(x, y + barH);
    ctx2.lineTo(x, y + r);
    ctx2.quadraticCurveTo(x, y, x + r, y);
    ctx2.closePath();
    ctx2.fill();
  }

  ctx2.restore();
  vizRaf = requestAnimationFrame(drawViz);
}

function startViz() { if (vizRaf) return; drawViz(); }
function stopViz() {
  if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf = null; }
  vizSmooth.fill(0); vizPeak = 0.0001;
  const c = document.getElementById('vizCanvas');
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
}

// ─── Static waveform (progress bar) ───────────────────────
const waveformCache = {};
let currentWaveform = null, currentWaveformKey = null;
let currentPCM = null; // { data: Float32Array, sampleRate } for the live viz

function drawWaveformOnCanvas(c) {
  if (!c) return;
  const ctx2 = c.getContext('2d');
  const dpr  = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  ctx2.clearRect(0, 0, c.width, c.height);
  ctx2.save();
  ctx2.scale(dpr, dpr);
  const BARS = 60, gap = 2;
  const barW = (W - gap * (BARS - 1)) / BARS;
  if (!currentWaveform) {
    ctx2.fillStyle = 'rgba(91,141,239,0.18)';
    for (let i = 0; i < BARS; i++)
      ctx2.fillRect(i * (barW + gap), H - 3, barW, 3);
    ctx2.restore(); return;
  }
  const usableH = H - 4;
  const progress = audio.duration ? audio.currentTime / audio.duration : 0;
  const progressX = progress * W;
  const gradP = ctx2.createLinearGradient(0, H, W, 0);
  gradP.addColorStop(0,   '#4A7AE0');
  gradP.addColorStop(0.5, '#8B7FE8');
  gradP.addColorStop(1,   '#C490F5');
  for (let i = 0; i < BARS; i++) {
    const x = i * (barW + gap);
    const barH = Math.max(3, currentWaveform[i] * usableH);
    const y = H - barH;
    const r = Math.min(4, barW / 2);
    ctx2.fillStyle = (x + barW / 2) <= progressX ? gradP : 'rgba(91,141,239,0.22)';
    ctx2.beginPath();
    ctx2.moveTo(x + r, y);
    ctx2.lineTo(x + barW - r, y);
    ctx2.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx2.lineTo(x + barW, y + barH);
    ctx2.lineTo(x, y + barH);
    ctx2.lineTo(x, y + r);
    ctx2.quadraticCurveTo(x, y, x + r, y);
    ctx2.closePath();
    ctx2.fill();
  }
  ctx2.restore();
}
function drawWaveform() {
  drawWaveformOnCanvas(document.getElementById('waveCanvas'));
}

async function loadWaveform(url, key) {
  currentWaveformKey = key;
  currentPCM = null;
  currentWaveform = waveformCache[key] || null;
  drawWaveform();
  let decCtx;
  try { decCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  try {
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    const decoded = await decCtx.decodeAudioData(buf);
    const ch = decoded.getChannelData(0);
    // Keep a copy of the PCM samples for the live (FFT) visualizer
    if (currentWaveformKey === key) currentPCM = { data: ch.slice(0), sampleRate: decoded.sampleRate };
    // Compute the static waveform bars if not already cached
    if (!waveformCache[key]) {
      const BARS = 60, step = Math.floor(ch.length / BARS);
      const wf = new Float32Array(BARS);
      for (let i = 0; i < BARS; i++) {
        let s = 0;
        for (let j = 0; j < step; j++) s += ch[i * step + j] ** 2;
        wf[i] = Math.sqrt(s / step);
      }
      let mx = 0; for (let i = 0; i < BARS; i++) if (wf[i] > mx) mx = wf[i];
      if (mx > 0) for (let i = 0; i < BARS; i++) wf[i] /= mx;
      waveformCache[key] = wf;
    }
    if (currentWaveformKey === key) { currentWaveform = waveformCache[key]; drawWaveform(); }
    decCtx.close();
  } catch(e) { try { decCtx.close(); } catch(_) {} }
}

function closePlayer() {
  audio.pause(); stopViz(); lastPlayT = null; saveDailyTime(); revokeObjURL();
  currentWaveform = null; currentWaveformKey = null; currentPCM = null;
  const wc = document.getElementById('waveCanvas');
  if (wc) wc.getContext('2d').clearRect(0, 0, wc.width, wc.height);
  if (speedAltMode) {
    speedAltMode = false;
    document.getElementById('speedSection').style.display = '';
    document.getElementById('speedAltProg').style.display = 'none';
  }
  closeTrans(); transToken++; currentTransText = null; currentAnsText = null; refreshTransBtn();
  overlay.classList.remove('open'); cur = null;
}
document.getElementById('btnClose').addEventListener('click', closePlayer);
document.getElementById('btnHistoryClose').addEventListener('click', closeHistory);

function refreshCacheBtn(cacheKey, isCachedNow) {
  const btn = document.getElementById('btnCache');
  const ico = document.getElementById('iconCache');
  if (!btn || !ico) return;
  btn.className = 'btn-cache' + (isCachedNow ? ' cached' : '');
  ico.className = isCachedNow ? 'fas fa-circle-check' : 'fas fa-download';
  btn.title = isCachedNow ? 'オフライン保存済（タップで削除）' : 'オフライン保存';
}
document.getElementById('btnCache').addEventListener('click', async () => {
  if (!cur) return;
  const y = cfg.years.find(x => x.id === cur.yId);
  const t = cfg.terms.find(x => x.id === cur.tId);
  const l = cfg.levels.find(x => x.id === cur.lId);
  if (!y || !t || !l) return;
  const cacheKey = audioPath(y, t, l, cur.n);
  const btn = document.getElementById('btnCache');
  const ico = document.getElementById('iconCache');
  if (btn.classList.contains('cached')) {
    await idbDel(cacheKey).catch(() => {});
    cachedKeys.delete(cacheKey);
    revokeObjURL();
    audio.src = audioUrlWorker(y, t, l, cur.n);
    refreshCacheBtn(cacheKey, false);
    render();
  } else {
    ico.className = 'fas fa-spinner fa-spin';
    btn.disabled = true;
    try {
      const res = await fetch(audioUrlWorker(y, t, l, cur.n));
      if (!res.ok) throw new Error('fetch failed');
      const blob = await res.blob();
      await idbPut(cacheKey, blob);
      cachedKeys.add(cacheKey);
      revokeObjURL();
      currentObjURL = URL.createObjectURL(blob);
      const pos = audio.currentTime;
      audio.src = currentObjURL;
      audio.currentTime = pos;
      refreshCacheBtn(cacheKey, true);
      render();
    } catch {
      ico.className = 'fas fa-download';
    } finally {
      btn.disabled = false;
    }
  }
});
document.getElementById('historyOverlay').addEventListener('click', e => { if (e.target === document.getElementById('historyOverlay')) closeHistory(); });

/* ── Translation / answer viewer ── */
function loadTransFont() {
  const v = parseInt(localStorage.getItem(TRANS_FONT_KEY), 10);
  if (!isNaN(v) && v >= 0 && v < TRANS_FONT_SIZES.length) transFontIdx = v;
}
function applyTransFont() {
  const body = document.getElementById('transBody');
  if (body) body.style.fontSize = TRANS_FONT_SIZES[transFontIdx];
  const lvl = document.getElementById('transFontLvl');
  if (lvl) lvl.textContent = transFontIdx + 1;
}
function cycleTransFont() {
  transFontIdx = (transFontIdx + 1) % TRANS_FONT_SIZES.length;
  try { localStorage.setItem(TRANS_FONT_KEY, String(transFontIdx)); } catch {}
  applyTransFont();
}
document.getElementById('btnTransFont').addEventListener('click', cycleTransFont);
function refreshTransBtn() {
  const btn = document.getElementById('btnTrans');
  if (btn) btn.disabled = !(currentTransText || currentAnsText);
}
function renderTransContent() {
  const hasTrans = !!currentTransText, hasAns = !!currentAnsText;
  if (transActiveTab === 'trans' && !hasTrans && hasAns) transActiveTab = 'answer';
  if (transActiveTab === 'answer' && !hasAns && hasTrans) transActiveTab = 'trans';
  const isTrans = transActiveTab !== 'answer';
  const tabT = document.getElementById('transTabTrans');
  const tabA = document.getElementById('transTabAnswer');
  tabT.disabled = !hasTrans; tabA.disabled = !hasAns;
  tabT.classList.toggle('active', isTrans);
  tabA.classList.toggle('active', !isTrans);
  setTransBody(isTrans ? (currentTransText || '') : (currentAnsText || ''), isTrans);
  applyTransFont();
}
// 和訳の簡易記法: 行頭「@@」で字下げなし、「**文字**」で太字
function transInline(line) {
  return esc(line)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<u>$1</u>');
}
function setTransBody(text, indent) {
  // 和訳・解答とも同じ記法を適用。indent=true（和訳）のときだけ段落を2em字下げ。
  const body = document.getElementById('transBody');
  body.classList.toggle('indent', !!indent);
  body.innerHTML = text.split('\n').map(line => {
    if (line.trim() === '') return '<div class="tr-para">&nbsp;</div>';
    let flush = false, heading = false;
    if (line.startsWith('@@')) { flush = true; line = line.slice(2); }
    else if (line.startsWith('#')) { flush = true; heading = true; line = line.replace(/^#+\s*/, ''); }
    const inner = heading ? `<strong>${transInline(line)}</strong>` : transInline(line);
    return `<div class="tr-para${flush ? ' tr-flush' : ''}">${inner}</div>`;
  }).join('');
}
function setTransTab(tab) { transActiveTab = tab; renderTransContent(); }
function closeTrans() { document.getElementById('transOverlay').classList.remove('open'); }
document.getElementById('transTabTrans').addEventListener('click', () => { if (currentTransText) setTransTab('trans'); });
document.getElementById('transTabAnswer').addEventListener('click', () => { if (currentAnsText) setTransTab('answer'); });
document.getElementById('btnTrans').addEventListener('click', () => {
  if (!currentTransText && !currentAnsText) return;
  transActiveTab = currentTransText ? 'trans' : 'answer';
  renderTransContent();
  document.getElementById('transOverlay').classList.add('open');
});
document.getElementById('btnTransClose').addEventListener('click', closeTrans);
document.getElementById('transOverlay').addEventListener('click', e => { if (e.target === document.getElementById('transOverlay')) closeTrans(); });

function getCurIdx() {
  if (!cur) return -1;
  return currentRows.findIndex(r => r.y.id === cur.yId && r.t.id === cur.tId && r.l.id === cur.lId && r.n === cur.n);
}
function updateNavButtons() {
  const idx = getCurIdx();
  const total = currentRows.length;
  const btnP = document.getElementById('btnPrevLesson');
  const btnN = document.getElementById('btnNextLesson');
  if (btnP) btnP.disabled = idx <= 0;
  if (btnN) btnN.disabled = idx < 0 || idx >= total - 1;
  const lbl = document.getElementById('navLabel');
  if (lbl) lbl.textContent = total > 1 ? `${idx + 1} / ${total}` : '';
}
document.getElementById('btnPrevLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx > 0) { const r = currentRows[idx - 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
document.getElementById('btnNextLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx >= 0 && idx < currentRows.length - 1) { const r = currentRows[idx + 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });

function handleParams() {
  const p = new URLSearchParams(location.search);
  const yTag = p.get('year'), tTag = p.get('term'), lTag = p.get('level'), n = parseInt(p.get('lesson'), 10);
  if (!yTag || !tTag || !lTag || !n) return;
  const y = cfg.years.find(x => x.tag === yTag);
  const t = cfg.terms.find(x => x.tag === tTag);
  const l = cfg.levels.find(x => x.tag === lTag);
  if (!y || !t || !l) return;
  const lessons = (t.levelLessons || {})[l.id] ?? t.lessons;
  if (n < 1 || n > lessons) return;
  fetch(audioUrlWorker(y, t, l, n), { method: 'HEAD' })
    .then(res => { if (res.ok) openPlayer(y.id, t.id, l.id, n); })
    .catch(() => {});
}

async function init() {
  loadDone(); loadDailyTime(); updateDailyTimeBadge(); loadTransFont();
  await loadCachedKeys();
  try { await loadCfg(); }
  catch { document.getElementById('tableContainer').innerHTML = '<div class="msg-c err">コンテンツを読み込めませんでした</div>'; return; }
  if (cfg.siteTitle) {
    document.getElementById('appTitle').textContent = cfg.siteTitle;
    document.title = cfg.siteTitle;
  }
  populateFilters(); render(); handleParams();
  document.getElementById('filterYear').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterTerm').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterLevel').addEventListener('change', () => { saveFilter(); render(); });
}
init();
