<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>DKE Medical English</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a4a6b; --navy-dk: #123452; --navy-lt: #e8f0f7;
      --green: #388e3c; --green-lt: #e8f5e9; --red: #d32f2f;
      --border: #dde2e8; --bg: #f4f6fa; --text: #1a1a2e; --muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .app-header { background: var(--navy); color: #fff; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .app-title { font-size: 1rem; font-weight: 700; }
    .badge { font-size: .78rem; background: rgba(255,255,255,.18); padding: 4px 12px; border-radius: 20px; white-space: nowrap; }

    .filter-bar { background: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); }
    .filter-bar select { flex: 1 1 calc(33% - 8px); min-width: 100px; height: 38px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; font-size: .8rem; background: #fff; color: var(--text); }

    .table-scroll { overflow-x: auto; padding: 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    thead th { background: var(--navy); color: #fff; padding: 11px 12px; text-align: left; font-size: .78rem; font-weight: 600; }
    tbody td { padding: 10px 12px; border-bottom: 1px solid #f0f2f6; font-size: .84rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.done-row { background: var(--green-lt); }
    .ops { display: flex; gap: 6px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; cursor: pointer; font-size: .78rem; font-weight: 600; padding: 0 10px; height: 34px; min-width: 44px; white-space: nowrap; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
    .btn:active { opacity: .7; }
    .btn-play  { background: var(--navy); color: #fff; }
    .btn-done  { background: #f0f2f6; color: var(--muted); }
    .btn-done.is-done { background: var(--green); color: #fff; }

    .msg-c { text-align: center; padding: 48px 20px; color: var(--muted); font-size: .9rem; }
    .msg-c.err { color: var(--red); }

    footer { text-align: center; padding: 20px; font-size: .78rem; color: var(--muted); }
    footer a { color: var(--navy); text-decoration: none; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 92%; max-width: 480px; max-height: 90dvh; background: #fff; border-radius: 16px; padding: 20px 20px 28px; overflow-y: auto; }

    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .pl-title { font-size: .95rem; font-weight: 700; color: var(--navy); line-height: 1.4; flex: 1; padding-right: 12px; }
    .btn-close { width: 32px; height: 32px; border: none; background: #f0f2f6; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .prog-wrap { position: relative; height: 44px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; }
    .prog-track { position: absolute; left: 0; right: 0; height: 6px; background: #e2e6ea; border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0; background: var(--navy); border-radius: 3px; }
    .prog-thumb { position: absolute; width: 18px; height: 18px; background: var(--navy); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 4px rgba(26,74,107,.4); }
    .time-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: 16px; }

    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 44px; min-height: 44px; cursor: pointer; color: var(--navy); -webkit-tap-highlight-color: transparent; }
    .ctrl-btn:active { background: var(--navy-lt); }
    .ctrl-btn-main { background: var(--navy); color: #fff; min-width: 60px; min-height: 60px; box-shadow: 0 2px 12px rgba(26,74,107,.3); }
    .ctrl-btn-main:active { background: var(--navy-dk); }
    .ctrl-btn-stop { color: #e53935; }

    .speed-wrap { margin-bottom: 14px; }
    .speed-slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .lbl-sm { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
    .speed-val { font-size: .8rem; font-weight: 700; color: var(--navy); width: 3.2em; text-align: right; flex-shrink: 0; }
    .speed-preset-row { display: flex; gap: 6px; justify-content: center; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: #555; font-size: .78rem; font-weight: 600; padding: 5px 10px; border-radius: 20px; cursor: pointer; min-height: 36px; -webkit-tap-highlight-color: transparent; }
    .btn-preset.active { border-color: var(--navy); background: var(--navy); color: #fff; }

    .vol-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .vol-icon { color: var(--muted); flex-shrink: 0; }
    .vol-note { font-size: .75rem; color: #aaa; text-align: center; margin-bottom: 8px; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 3px; background: #e2e6ea; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); cursor: pointer; border: none; }

    .btn-mark-done { width: 100%; height: 48px; border: none; border-radius: 12px; font-size: .95rem; font-weight: 700; cursor: pointer; background: var(--green); color: #fff; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
    .btn-mark-done:active { opacity: .8; }
    .btn-mark-done.is-done { background: #e0e0e0; color: var(--muted); }
  </style>
</head>
<body>

<header class="app-header">
  <span class="app-title" id="appTitle">DKE Medical English</span>
  <span class="badge" id="completionBadge">完了: 0 / 0</span>
</header>
<script>
// Apply siteTitle immediately from localStorage (before async loadCfg) to avoid flash of default title
(function(){
  try {
    const t = localStorage.getItem('dke_site_title') ||
              (JSON.parse(localStorage.getItem('dke_settings')||'{}') || {}).siteTitle || '';
    if (t) { document.getElementById('appTitle').textContent = t; document.title = t; }
  } catch(e) {}
})();
</script>

<div class="filter-bar">
  <select id="filterYear"></select>
  <select id="filterTerm"></select>
  <select id="filterLevel"></select>
</div>

<div class="table-scroll">
  <div id="tableContainer"><div class="msg-c">読み込み中…</div></div>
</div>


<!-- Player modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose">✕</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 5V2L7 7l5 5V9c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/><text x="9" y="16.5" font-size="5.5" font-weight="bold" fill="currentColor" font-family="sans-serif" text-anchor="middle">10</text></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay">
        <svg id="iconPlay" width="28" height="28" viewBox="0 0 24 24"><polygon points="7,4 21,12 7,20" fill="currentColor"/></svg>
        <svg id="iconPause" width="28" height="28" viewBox="0 0 24 24" style="display:none"><rect x="5" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="15" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn" id="btnFwd">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 5V2l5 5-5 5V9c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z" fill="currentColor"/><text x="15" y="16.5" font-size="5.5" font-weight="bold" fill="currentColor" font-family="sans-serif" text-anchor="middle">10</text></svg>
      </button>
    </div>
    <div class="speed-wrap">
      <div class="speed-slider-row">
        <span class="lbl-sm">速度</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.05" value="1">
        <span class="speed-val" id="speedVal">1.0x</span>
      </div>
      <div class="speed-preset-row">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
      </div>
    </div>
    <p class="vol-note" id="volNote" style="display:none">音量は端末のボタンで調整してください</p>
    <div class="vol-row" id="volRow">
      <span class="vol-icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"/></svg></span>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    </div>
    <button class="btn-mark-done" id="btnMarkDone">✓ 完了にする</button>
  </div>
</div>

<script>
const SK = 'dke_settings';
const DK = 'dke_completed';
const FK = 'dke_filter';
const DEFAULTS = {
  r2BaseUrl: 'https://textaudio.ryoxsakai.workers.dev',
  years:  [{ id: 'y1', name: '2026年度', tag: '2026' }],
  terms:  [{ id: 't1', name: '前期', tag: 'term1', lessons: 3 }, { id: 't2', name: '夏期', tag: 'term2', lessons: 2 }],
  levels: [{ id: 'l1', name: 'High 読解', tag: 'high_reading' }, { id: 'l2', name: 'High 構文', tag: 'high_structure' }, { id: 'l3', name: 'Standard 読解', tag: 'standard_reading' }, { id: 'l4', name: 'Standard 構文', tag: 'standard_structure' }]
};

let cfg = null, done = {}, cur = null;
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function loadDone() { try { done = JSON.parse(localStorage.getItem(DK) || '{}'); } catch { done = {}; } }
function saveDone() { localStorage.setItem(DK, JSON.stringify(done)); }
function mk(yId, tId, lId, n) { return `${yId}_${tId}_${lId}_${n}`; }

async function loadCfg() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(SK)); } catch {}
  // Try Worker URL first (direct R2 proxy), then r2BaseUrl, then hardcoded default
  const workerUrl = local?.r2WorkerUrl?.replace(/\/$/, '');
  const baseUrl   = (local?.r2BaseUrl || DEFAULTS.r2BaseUrl).replace(/\/$/, '');
  const fetchUrls = [...new Set([workerUrl, baseUrl].filter(Boolean))];
  // Apply localStorage as starting point
  cfg = {
    r2BaseUrl:    local?.r2BaseUrl    || DEFAULTS.r2BaseUrl,
    years:        local?.years?.length  ? local.years  : [...DEFAULTS.years],
    terms:        local?.terms?.length  ? local.terms  : [...DEFAULTS.terms],
    levels:       local?.levels?.length ? local.levels : [...DEFAULTS.levels],
    defaultYear:  local?.defaultYear  || '',
    defaultTerm:  local?.defaultTerm  || '',
    defaultLevel: local?.defaultLevel || '',
    lessonTitles: local?.lessonTitles || {},
    siteTitle:    local?.siteTitle    || localStorage.getItem('dke_site_title') || '',
  };
  // Overlay with R2 data (only non-empty values override)
  for (const url of fetchUrls) {
    try {
      const r = await fetch(`${url}/settings.json`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.years?.length)  cfg.years  = j.years;
      if (j.terms?.length)  cfg.terms  = j.terms;
      if (j.levels?.length) cfg.levels = j.levels;
      if (j.r2BaseUrl)    cfg.r2BaseUrl    = j.r2BaseUrl;
      if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
      if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
      if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
      if (j.lessonTitles && Object.keys(j.lessonTitles).length) cfg.lessonTitles = j.lessonTitles;
      if (j.siteTitle) cfg.siteTitle = j.siteTitle;
      break;
    } catch {}
  }
}

function allRows() {
  const rows = [];
  for (const y of cfg.years)
    for (const t of cfg.terms)
      for (const l of cfg.levels)
        for (let n = 1; n <= t.lessons; n++)
          rows.push({ y, t, l, n, key: mk(y.id, t.id, l.id, n) });
  return rows;
}
function audioUrl(y, t, l, n) { return `${cfg.r2BaseUrl}/${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`; }

function updateBadge() {
  const rows = allRows();
  document.getElementById('completionBadge').textContent = `完了: ${rows.filter(r => done[r.key]).length} / ${rows.length}`;
}

function render() {
  const yF = document.getElementById('filterYear').value;
  const tF = document.getElementById('filterTerm').value;
  const lF = document.getElementById('filterLevel').value;
  const rows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  updateBadge();
  const con = document.getElementById('tableContainer');
  if (!rows.length) { con.innerHTML = '<div class="msg-c">該当するコンテンツがありません</div>'; return; }
  let h = '<table><thead><tr><th>講</th><th>タイトル</th><th>操作</th></tr></thead><tbody>';
  for (const r of rows) {
    const d = !!done[r.key];
    const lessonTitle = cfg.lessonTitles?.[r.key] || '';
    h += `<tr class="${d ? 'done-row' : ''}">
      <td style="white-space:nowrap;">第${r.n}講</td>
      <td style="font-size:.82rem;color:var(--muted);">${lessonTitle ? esc(lessonTitle) : ''}</td>
      <td class="ops">
        <button class="btn btn-play" id="play-${r.key}" style="opacity:.35;padding:0;width:36px;" disabled onclick="openPlayer('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})"><svg width="14" height="14" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg></button>
        <button class="btn btn-done ${d ? 'is-done' : ''}" style="padding:0;width:36px;" onclick="toggleDone('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})">${d
          ? `<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M8 12l3 3 5-5" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
          : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        }</button>
      </td>
    </tr>`;
  }
  con.innerHTML = h + '</tbody></table>';
  if (cfg.r2BaseUrl) {
    rows.forEach(r => {
      fetch(audioUrl(r.y, r.t, r.l, r.n), { method: 'HEAD' }).then(res => {
        if (res.ok) {
          const btn = document.getElementById(`play-${r.key}`);
          if (btn) { btn.disabled = false; btn.style.opacity = ''; }
        }
      }).catch(() => {});
    });
  }
}

function saveFilter() {
  try {
    localStorage.setItem(FK, JSON.stringify({
      year:  document.getElementById('filterYear').value,
      term:  document.getElementById('filterTerm').value,
      level: document.getElementById('filterLevel').value
    }));
  } catch {}
}

function populateFilters() {
  const ySel = document.getElementById('filterYear');
  const tSel = document.getElementById('filterTerm');
  const lSel = document.getElementById('filterLevel');
  const yv = ySel.value, tv = tSel.value, lv = lSel.value;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(FK) || '{}'); } catch {}
  ySel.innerHTML = cfg.years.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
  tSel.innerHTML = cfg.terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  lSel.innerHTML = cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  if (yv) ySel.value = yv;
  else if (saved.year)      ySel.value = saved.year;
  else if (cfg.defaultYear) ySel.value = cfg.defaultYear;
  if (tv) tSel.value = tv;
  else if (saved.term)      tSel.value = saved.term;
  else if (cfg.defaultTerm) tSel.value = cfg.defaultTerm;
  if (lv) lSel.value = lv;
  else if (saved.level)      lSel.value = saved.level;
  else if (cfg.defaultLevel) lSel.value = cfg.defaultLevel;
}

function toggleDone(yId, tId, lId, n) {
  const k = mk(yId, tId, lId, n);
  if (done[k]) delete done[k]; else done[k] = true;
  saveDone(); render();
  if (cur && cur.yId === yId && cur.tId === tId && cur.lId === lId && cur.n === n) refreshMarkBtn();
}

/* ── Player ── */
const audio   = document.getElementById('audio');
const overlay = document.getElementById('overlay');

function fmt(s) { return isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00'; }
function updProg() {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  document.getElementById('progFill').style.width = p + '%';
  document.getElementById('progThumb').style.left = p + '%';
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
}
audio.addEventListener('timeupdate', updProg);
audio.addEventListener('loadedmetadata', () => { document.getElementById('durTime').textContent = fmt(audio.duration); updProg(); });
audio.addEventListener('ended', () => setPI(false));

function setPI(playing) {
  document.getElementById('iconPlay').style.display  = playing ? 'none' : '';
  document.getElementById('iconPause').style.display = playing ? '' : 'none';
}
document.getElementById('btnPlay').addEventListener('click', () => {
  if (audio.paused) { audio.play(); setPI(true); } else { audio.pause(); setPI(false); }
});
document.getElementById('btnBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('btnFwd').addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

let seeking = false;
function seekTo(cx) {
  const r = document.getElementById('progWrap').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (cx - r.left) / r.width));
  if (audio.duration) audio.currentTime = p * audio.duration;
  updProg();
}
const pw = document.getElementById('progWrap');
pw.addEventListener('mousedown',  e => { seeking = true; seekTo(e.clientX); });
window.addEventListener('mousemove', e => { if (seeking) seekTo(e.clientX); });
window.addEventListener('mouseup',   () => { seeking = false; });
pw.addEventListener('touchstart', e => { seeking = true; seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (seeking) seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend',  () => { seeking = false; });

function setSpeed(v) {
  audio.playbackRate = v;
  document.getElementById('speedSlider').value = v;
  document.getElementById('speedVal').textContent = (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,'') + 'x';
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === v));
}
document.getElementById('speedSlider').addEventListener('input', e => setSpeed(parseFloat(e.target.value)));
document.querySelectorAll('.btn-preset').forEach(b => b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
if (isIOS) { document.getElementById('volRow').style.display = 'none'; document.getElementById('volNote').style.display = 'block'; }
else { document.getElementById('volSlider').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); }); }

function refreshMarkBtn() {
  if (!cur) return;
  const d = !!done[mk(cur.yId, cur.tId, cur.lId, cur.n)];
  const btn = document.getElementById('btnMarkDone');
  btn.textContent = d ? '✓ 完了済み（タップで取り消し）' : '✓ 完了にする';
  btn.className = 'btn-mark-done' + (d ? ' is-done' : '');
}
document.getElementById('btnMarkDone').addEventListener('click', () => {
  if (!cur) return;
  toggleDone(cur.yId, cur.tId, cur.lId, cur.n);
  refreshMarkBtn();
});

function openPlayer(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  cur = { yId, tId, lId, n };
  const lessonTitle = cfg.lessonTitles?.[mk(yId, tId, lId, n)] || '';
  const mainLabel = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  document.getElementById('playerTitle').innerHTML = lessonTitle
    ? `${esc(mainLabel)}<br><span style="font-size:.82rem;font-weight:400;color:var(--muted);">${esc(lessonTitle)}</span>`
    : esc(mainLabel);
  audio.src = audioUrl(y, t, l, n);
  audio.currentTime = 0;
  setPI(false);
  document.getElementById('durTime').textContent = '0:00';
  document.getElementById('curTime').textContent = '0:00';
  setSpeed(1);
  refreshMarkBtn();
  overlay.classList.add('open');
}
function closePlayer() { audio.pause(); overlay.classList.remove('open'); cur = null; }
document.getElementById('btnClose').addEventListener('click', closePlayer);
overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });

function handleParams() {
  const p = new URLSearchParams(location.search);
  const yTag = p.get('year'), tTag = p.get('term'), lTag = p.get('level'), n = parseInt(p.get('lesson'), 10);
  if (!yTag || !tTag || !lTag || !n) return;
  const y = cfg.years.find(x => x.tag === yTag);
  const t = cfg.terms.find(x => x.tag === tTag);
  const l = cfg.levels.find(x => x.tag === lTag);
  if (!y || !t || !l || n < 1 || n > t.lessons) return;
  fetch(audioUrl(y, t, l, n), { method: 'HEAD' })
    .then(res => { if (res.ok) openPlayer(y.id, t.id, l.id, n); })
    .catch(() => {});
}

async function init() {
  loadDone();
  try { await loadCfg(); }
  catch { document.getElementById('tableContainer').innerHTML = '<div class="msg-c err">コンテンツを読み込めませんでした</div>'; return; }
  if (cfg.siteTitle) {
    document.getElementById('appTitle').textContent = cfg.siteTitle;
    document.title = cfg.siteTitle;
  }
  populateFilters(); render(); handleParams();
  document.getElementById('filterYear').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterTerm').addEventListener('change',  () => { saveFilter(); render(); });
  document.getElementById('filterLevel').addEventListener('change', () => { saveFilter(); render(); });
}
init();
</script>
</body>
</html>
