<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>設定 | DKE Medical English</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a4a6b; --navy-dk: #123452; --navy-lt: #e8f0f7;
      --green: #388e3c; --red: #d32f2f;
      --border: #dde2e8; --bg: #f4f6fa; --text: #1a1a2e; --muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .app-header { background: var(--navy); color: #fff; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .app-header a { color: rgba(255,255,255,.8); text-decoration: none; font-size: 1.2rem; }
    .app-title { font-size: 1rem; font-weight: 700; }

    .tab-nav { display: flex; background: #fff; border-bottom: 2px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 56px; z-index: 9; }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; padding: 14px 16px; font-size: .82rem; font-weight: 600; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }
    .tab-panel { display: none; padding: 20px 16px 48px; }
    .tab-panel.active { display: block; }

    .sec-title { font-size: .9rem; font-weight: 700; color: var(--navy); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .sec-gap { margin-bottom: 28px; }

    .crud-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .crud-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .crud-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .crud-field { display: flex; flex-direction: column; gap: 3px; }
    .crud-field.wide { flex: 1; min-width: 100px; }
    .crud-field.narrow { width: 72px; }
    .crud-field label { font-size: .7rem; color: var(--muted); }
    .crud-field input { height: 36px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; font-size: .85rem; width: 100%; }
    .crud-actions { display: flex; gap: 6px; justify-content: flex-end; }

    .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; cursor: pointer; font-size: .82rem; font-weight: 600; height: 36px; padding: 0 14px; min-width: 44px; -webkit-tap-highlight-color: transparent; transition: opacity .15s; white-space: nowrap; }
    .btn:active { opacity: .7; }
    .btn-navy  { background: var(--navy); color: #fff; }
    .btn-ghost { background: #f0f2f6; color: var(--muted); }
    .btn-red   { background: #fce8e8; color: var(--red); }
    .btn-add   { background: var(--navy-lt); color: var(--navy); border: 1.5px dashed var(--navy); width: 100%; height: 40px; border-radius: 10px; }

    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-label { font-size: .8rem; font-weight: 600; color: var(--text); }
    .form-input { height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; font-size: .9rem; width: 100%; background: #fff; }
    .form-hint { font-size: .72rem; color: var(--muted); }
    .btn-save { width: 100%; height: 48px; font-size: .95rem; font-weight: 700; border-radius: 12px; margin-top: 8px; }

    /* Upload */
    .upload-select-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .upload-select-row select { flex: 1 1 calc(33% - 8px); min-width: 100px; height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; font-size: .875rem; background: #fff; }
    .file-drop { border: 2px dashed var(--border); border-radius: 12px; background: #fff; padding: 24px; text-align: center; cursor: pointer; margin-bottom: 14px; color: var(--muted); font-size: .875rem; transition: border-color .15s; }
    .file-drop.drag-over { border-color: var(--navy); background: var(--navy-lt); }
    #fileInput { display: none; }
    .preview-wrap { overflow-x: auto; margin-bottom: 14px; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 380px; }
    .preview-table th { background: var(--navy); color: #fff; padding: 8px 10px; text-align: left; }
    .preview-table td { padding: 7px 10px; border-bottom: 1px solid #f0f2f6; vertical-align: middle; }
    .preview-table tr:last-child td { border-bottom: none; }
    .preview-path { color: var(--navy); font-family: monospace; font-size: .78rem; }
    .lesson-num-input { width: 60px; height: 32px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: .85rem; padding: 0 4px; }
    .progress-wrap { background: #e2e6ea; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: var(--navy); border-radius: 6px; transition: width .2s; }
    .progress-text { font-size: .8rem; color: var(--muted); text-align: center; }

    /* Content list */
    .cl-scroll { overflow-x: auto; }
    table.cl { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    table.cl thead th { background: var(--navy); color: #fff; padding: 11px 12px; text-align: left; font-size: .78rem; }
    table.cl tbody td { padding: 9px 12px; border-bottom: 1px solid #f0f2f6; font-size: .83rem; vertical-align: middle; }
    table.cl tbody tr:last-child td { border-bottom: none; }
    .ops { display: flex; gap: 6px; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px; font-size: .875rem; font-weight: 600; z-index: 9999; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.15); animation: slideUp .25s ease; }
    .toast.ok  { background: #2e7d32; color: #fff; }
    .toast.err { background: #c62828; color: #fff; }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* Overlay / Sheet */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: flex-end; }
    .overlay.open { display: flex; }
    .sheet { width: 100%; max-height: 92dvh; background: #fff; border-radius: 20px 20px 0 0; padding: 20px 20px 32px; overflow-y: auto; }

    /* Player */
    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .pl-title { font-size: .95rem; font-weight: 700; color: var(--navy); line-height: 1.4; flex: 1; padding-right: 12px; }
    .btn-close { width: 32px; height: 32px; border: none; background: #f0f2f6; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .prog-wrap { position: relative; height: 44px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; }
    .prog-track { position: absolute; left: 0; right: 0; height: 6px; background: #e2e6ea; border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; width: 0; background: var(--navy); border-radius: 3px; }
    .prog-thumb { position: absolute; width: 18px; height: 18px; background: var(--navy); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 4px rgba(26,74,107,.4); }
    .time-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: 16px; }
    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 44px; min-height: 44px; cursor: pointer; color: var(--navy); -webkit-tap-highlight-color: transparent; }
    .ctrl-btn:active { background: var(--navy-lt); }
    .ctrl-btn-main { background: var(--navy); color: #fff; min-width: 60px; min-height: 60px; box-shadow: 0 2px 12px rgba(26,74,107,.3); }
    .ctrl-btn-main:active { background: var(--navy-dk); }
    .ctrl-btn-stop { color: #e53935; }
    .speed-wrap { margin-bottom: 14px; }
    .speed-slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .lbl-sm { font-size: .75rem; color: var(--muted); flex-shrink: 0; }
    .speed-val { font-size: .8rem; font-weight: 700; color: var(--navy); width: 3.2em; text-align: right; flex-shrink: 0; }
    .speed-preset-row { display: flex; gap: 6px; justify-content: center; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: #555; font-size: .78rem; font-weight: 600; padding: 5px 10px; border-radius: 20px; cursor: pointer; min-height: 36px; -webkit-tap-highlight-color: transparent; }
    .btn-preset.active { border-color: var(--navy); background: var(--navy); color: #fff; }
    .vol-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .vol-icon { color: var(--muted); flex-shrink: 0; }
    .vol-note { font-size: .75rem; color: #aaa; text-align: center; margin-bottom: 8px; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 6px; border-radius: 3px; background: #e2e6ea; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--navy); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--navy); cursor: pointer; border: none; }

    /* QR */
    .qr-sheet { max-width: 360px; margin: 0 auto; text-align: center; }
    .qr-sub { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    #qrCanvas { display: inline-block; margin-bottom: 14px; }
    .qr-url { font-size: .72rem; color: var(--navy); word-break: break-all; margin-bottom: 14px; line-height: 1.5; }

    .msg-c { text-align: center; padding: 32px 20px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>

<header class="app-header">
  <a href="../">←</a>
  <span class="app-title">設定</span>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="t1">コンテンツ設定</button>
  <button class="tab-btn" data-tab="t2">R2設定</button>
  <button class="tab-btn" data-tab="t3">ファイルアップロード</button>
  <button class="tab-btn" data-tab="t4">コンテンツ一覧</button>
</nav>

<!-- Tab1: コンテンツ設定 -->
<div class="tab-panel active" id="t1">
  <div class="sec-gap">
    <div class="sec-title">年度の設定</div>
    <div class="crud-list" id="yearList"></div>
    <button class="btn btn-add" id="addYearBtn">＋ 年度を追加</button>
  </div>
  <div class="sec-gap">
    <div class="sec-title">学期の設定</div>
    <div class="crud-list" id="termList"></div>
    <button class="btn btn-add" id="addTermBtn">＋ 学期を追加</button>
  </div>
  <div class="sec-gap">
    <div class="sec-title">レベルの設定</div>
    <div class="crud-list" id="levelList"></div>
    <button class="btn btn-add" id="addLevelBtn">＋ レベルを追加</button>
  </div>
  <button class="btn btn-navy btn-save" id="saveContentBtn">保存する</button>
</div>

<!-- Tab2: R2設定 -->
<div class="tab-panel" id="t2">
  <div class="form-row">
    <label class="form-label">R2 ベースURL（公開URL）</label>
    <input class="form-input" id="r2BaseUrl" type="url" placeholder="https://pub-xxxx.r2.dev">
    <span class="form-hint">音声ファイルの公開ベースURL</span>
  </div>
  <div class="form-row">
    <label class="form-label">Account ID</label>
    <input class="form-input" id="r2AccountId" type="text" placeholder="Cloudflare Account ID">
  </div>
  <div class="form-row">
    <label class="form-label">Access Key ID</label>
    <input class="form-input" id="r2AccessKeyId" type="password" placeholder="R2 Access Key ID">
  </div>
  <div class="form-row">
    <label class="form-label">Secret Access Key</label>
    <input class="form-input" id="r2SecretKey" type="password" placeholder="R2 Secret Access Key">
  </div>
  <div class="form-row">
    <label class="form-label">バケット名</label>
    <input class="form-input" id="r2Bucket" type="text" value="textaudio">
  </div>
  <div class="form-row">
    <label class="form-label">Worker URL <span style="font-weight:400;color:var(--muted)">（アップロード用・任意）</span></label>
    <input class="form-input" id="r2WorkerUrl" type="url" placeholder="https://textaudio-upload.xxxxx.workers.dev">
    <div class="form-hint">Cloudflare Worker 経由でアップロードする場合に入力。設定すると AWS 署名不要になります。</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:4px;">
    <button class="btn btn-ghost" id="testConnBtn" style="flex:1;height:44px;">接続テスト</button>
    <button class="btn btn-navy btn-save" id="saveR2Btn" style="flex:2;">保存する</button>
  </div>
</div>

<!-- Tab3: ファイルアップロード -->
<div class="tab-panel" id="t3">
  <div class="upload-select-row">
    <select id="upYear"><option value="">年度を選択</option></select>
    <select id="upTerm"><option value="">学期を選択</option></select>
    <select id="upLevel"><option value="">レベルを選択</option></select>
  </div>
  <div style="background:#f8f9fb;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:.7rem;color:var(--muted);margin-bottom:2px;">R2 APIエンドポイント</div>
      <div id="r2ApiUrlDisplay" style="font-size:.75rem;font-family:monospace;color:var(--navy);word-break:break-all;">—</div>
    </div>
    <button class="btn btn-ghost" id="testUploadApiBtn" style="flex-shrink:0;height:36px;font-size:.78rem;">接続テスト</button>
  </div>
  <div class="file-drop" id="fileDrop">
    <div>タップまたはドラッグでMP3を選択</div>
    <div style="font-size:.75rem;margin-top:4px;">複数選択可・ファイル名の数字を講番号に自動反映</div>
    <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple>
  </div>
  <div id="previewSection" style="display:none">
    <div class="preview-wrap">
      <table class="preview-table">
        <thead><tr><th>#</th><th>元のファイル名</th><th>講番号</th><th>アップロード先</th></tr></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <button class="btn btn-navy btn-save" id="uploadBtn">アップロード開始</button>
    <div id="uploadProgress" style="display:none;margin-top:14px;">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>
  </div>
</div>

<!-- Tab4: コンテンツ一覧 -->
<div class="tab-panel" id="t4">
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
    <select id="clYear" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
    <select id="clTerm" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
    <select id="clLevel" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
  </div>
  <div class="cl-scroll"><div id="contentListTable"><div class="msg-c">読み込み中…</div></div></div>
</div>

<!-- Player overlay -->
<div class="overlay" id="playerOverlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose">✕</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <div class="prog-wrap" id="progWrap">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 5V2L7 7l5 5V9c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/><text x="9" y="16.5" font-size="5.5" font-weight="bold" fill="currentColor" font-family="sans-serif" text-anchor="middle">10</text></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-stop" id="btnStop">
        <svg width="28" height="28" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay">
        <svg id="iconPlay" width="28" height="28" viewBox="0 0 24 24"><polygon points="7,4 21,12 7,20" fill="currentColor"/></svg>
        <svg id="iconPause" width="28" height="28" viewBox="0 0 24 24" style="display:none"><rect x="5" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="15" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn" id="btnFwd">
        <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 5V2l5 5-5 5V9c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z" fill="currentColor"/><text x="15" y="16.5" font-size="5.5" font-weight="bold" fill="currentColor" font-family="sans-serif" text-anchor="middle">10</text></svg>
      </button>
    </div>
    <div class="speed-wrap">
      <div class="speed-slider-row">
        <span class="lbl-sm">速度</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.05" value="1">
        <span class="speed-val" id="speedVal">1.0x</span>
      </div>
      <div class="speed-preset-row">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
      </div>
    </div>
    <p class="vol-note" id="volNote" style="display:none">音量は端末のボタンで調整してください</p>
    <div class="vol-row" id="volRow">
      <span class="vol-icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"/></svg></span>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
</div>

<!-- QR overlay -->
<div class="overlay" id="qrOverlay">
  <div class="sheet qr-sheet">
    <div class="pl-header" style="justify-content:flex-end;margin-bottom:12px;">
      <button class="btn-close" id="qrClose">✕</button>
    </div>
    <div class="pl-title" id="qrTitle" style="margin-bottom:8px;text-align:center;"></div>
    <div class="qr-sub">スキャンで直接再生</div>
    <div id="qrCanvas"></div>
    <div class="qr-url" id="qrUrlText"></div>
    <button class="btn btn-navy" id="btnCopyUrl" style="width:100%;height:44px;font-size:.875rem;">URLをコピー</button>
  </div>
</div>

<script>
const SK = 'dke_settings';
const BASE_URL = 'https://ryoxsakai.github.io/textaudio';
const DEFAULTS = {
  r2BaseUrl: BASE_URL,
  years:  [{ id: 'y1', name: '2026年度', tag: '2026' }],
  terms:  [{ id: 't1', name: '前期', tag: 'term1', lessons: 3 }, { id: 't2', name: '夏期', tag: 'term2', lessons: 2 }],
  levels: [{ id: 'l1', name: 'High 読解', tag: 'high_reading' }, { id: 'l2', name: 'High 構文', tag: 'high_structure' }, { id: 'l3', name: 'Standard 読解', tag: 'standard_reading' }, { id: 'l4', name: 'Standard 構文', tag: 'standard_structure' }]
};

let cfg = {
  r2BaseUrl: '', r2AccountId: '', r2AccessKeyId: '', r2SecretKey: '', r2Bucket: 'textaudio',
  r2WorkerUrl: '',
  years: [], terms: [], levels: [],
  defaultYear: '', defaultTerm: '', defaultLevel: ''
};

/* ── Toast ── */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ── Tabs ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function switchTab(tabId) {
  const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
  localStorage.setItem('dke_active_tab', tabId);
  if (tabId === 't4') renderContentList();
  if (tabId === 't3') populateUploadSelects();
}

/* ── Load settings ── */
async function loadAllSettings() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(SK)); } catch {}
  cfg.r2AccountId  = local?.r2AccountId  || '';
  cfg.r2AccessKeyId = local?.r2AccessKeyId || '';
  cfg.r2SecretKey  = local?.r2SecretKey  || '';
  cfg.r2Bucket     = local?.r2Bucket     || 'textaudio';
  cfg.r2BaseUrl    = local?.r2BaseUrl    || DEFAULTS.r2BaseUrl;
  cfg.r2WorkerUrl  = local?.r2WorkerUrl  || '';

  if (cfg.r2BaseUrl) {
    try {
      const r = await fetch(`${cfg.r2BaseUrl}/settings.json`);
      if (r.ok) {
        const j = await r.json();
        cfg.years  = j.years  || [...DEFAULTS.years];
        cfg.terms  = j.terms  || [...DEFAULTS.terms];
        cfg.levels = j.levels || [...DEFAULTS.levels];
        if (j.r2BaseUrl)    cfg.r2BaseUrl    = j.r2BaseUrl;
        if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
        if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
        if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
        return;
      }
    } catch {}
  }
  cfg.years  = (local?.years  && local.years.length)  ? local.years  : [...DEFAULTS.years];
  cfg.terms  = (local?.terms  && local.terms.length)  ? local.terms  : [...DEFAULTS.terms];
  cfg.levels = (local?.levels && local.levels.length) ? local.levels : [...DEFAULTS.levels];
  cfg.defaultYear  = local?.defaultYear  || '';
  cfg.defaultTerm  = local?.defaultTerm  || '';
  cfg.defaultLevel = local?.defaultLevel || '';
}

function persistLocal() {
  localStorage.setItem(SK, JSON.stringify({
    r2BaseUrl: cfg.r2BaseUrl, r2AccountId: cfg.r2AccountId,
    r2AccessKeyId: cfg.r2AccessKeyId, r2SecretKey: cfg.r2SecretKey, r2Bucket: cfg.r2Bucket,
    r2WorkerUrl: cfg.r2WorkerUrl,
    years: cfg.years, terms: cfg.terms, levels: cfg.levels,
    defaultYear: cfg.defaultYear, defaultTerm: cfg.defaultTerm, defaultLevel: cfg.defaultLevel
  }));
}

/* ── CRUD helper ── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function makeCrudItem(fields, actions) {
  const div = document.createElement('div');
  div.className = 'crud-item';
  div.innerHTML = `<div class="crud-fields">${fields}</div><div class="crud-actions">${actions}</div>`;
  return div;
}

function setDefault(arr, id) {
  if (arr === 'years')  { cfg.defaultYear  = id; renderYearList(); }
  if (arr === 'terms')  { cfg.defaultTerm  = id; renderTermList(); }
  if (arr === 'levels') { cfg.defaultLevel = id; renderLevelList(); }
}

/* ── Year CRUD ── */
function renderYearList() {
  const el = document.getElementById('yearList');
  el.innerHTML = '';
  cfg.years.forEach((y, i) => {
    const isDef = cfg.defaultYear === y.id || (!cfg.defaultYear && i === 0);
    const div = makeCrudItem(
      `<div class="crud-field wide"><label>表示名</label><input type="text" value="${esc(y.name)}" data-field="name" data-arr="years" data-idx="${i}"></div>
       <div class="crud-field wide"><label>タグ（英字）</label><input type="text" value="${esc(y.tag)}" data-field="tag" data-arr="years" data-idx="${i}"></div>`,
      `<button class="btn ${isDef?'btn-navy':'btn-ghost'}" style="height:32px;padding:0 10px;font-size:.75rem;" onclick="setDefault('years','${y.id}')">${isDef?'★ デフォルト':'デフォルト'}</button>
       <button class="btn btn-ghost" style="height:32px;padding:0 10px;font-size:.75rem;" onclick="moveArr('years',${i},-1,renderYearList)" ${i===0?'disabled':''}>↑</button>
       <button class="btn btn-ghost" style="height:32px;padding:0 10px;font-size:.75rem;" onclick="moveArr('years',${i},1,renderYearList)" ${i===cfg.years.length-1?'disabled':''}>↓</button>
       <button class="btn btn-red"   style="height:32px;padding:0 10px;font-size:.75rem;" onclick="delArr('years',${i},renderYearList)">削除</button>`
    );
    div.querySelectorAll('input').forEach(attachCrudInput);
    el.appendChild(div);
  });

/* ── CRUD shared helpers ── */
function attachCrudInput(inp) {
  inp.addEventListener('input', e => {
    const idx = +e.target.dataset.idx, f = e.target.dataset.field, arr = e.target.dataset.arr;
    cfg[arr][idx][f] = f === 'lessons' ? Math.max(1, parseInt(e.target.value)||1) : e.target.value;
  });
}
function moveArr(arr, i, dir, render) {
  const j = i + dir;
  if (j < 0 || j >= cfg[arr].length) return;
  [cfg[arr][i], cfg[arr][j]] = [cfg[arr][j], cfg[arr][i]];
  render();
}
function delArr(arr, i, render) { cfg[arr].splice(i, 1); render(); }

/* ── Save content settings ── */
document.getElementById('saveContentBtn').addEventListener('click', async () => {
  const errs = [];
  cfg.years.forEach((y,i)  => { if (!y.name.trim()) errs.push(`年度${i+1}の表示名が空です`); if (!y.tag.trim()) errs.push(`年度${i+1}のタグが空です`); });
  cfg.terms.forEach((t,i)  => { if (!t.name.trim()) errs.push(`学期${i+1}の表示名が空です`); if (!t.tag.trim()) errs.push(`学期${i+1}のタグが空です`); });
  cfg.levels.forEach((l,i) => { if (!l.name.trim()) errs.push(`レベル${i+1}の表示名が空です`); if (!l.tag.trim()) errs.push(`レベル${i+1}のタグが空です`); });
  if (errs.length) { toast(errs[0], 'err'); return; }

  persistLocal();
  const json = JSON.stringify({ r2BaseUrl: cfg.r2BaseUrl, years: cfg.years, terms: cfg.terms, levels: cfg.levels, defaultYear: cfg.defaultYear, defaultTerm: cfg.defaultTerm, defaultLevel: cfg.defaultLevel }, null, 2);

  if (cfg.r2WorkerUrl || (cfg.r2AccountId && cfg.r2AccessKeyId && cfg.r2SecretKey && cfg.r2Bucket)) {
    try {
      let res;
      if (cfg.r2WorkerUrl) {
        res = await putViaWorker('settings.json', json, 'application/json');
      } else {
        const url = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/settings.json`;
        res = await signedPut(url, json, 'application/json');
      }
      if (!res.ok) throw new Error(res.status);
      toast('保存しました（LocalStorage + R2）');
    } catch (e) {
      toast('LocalStorageに保存しました（R2アップロード失敗: ' + e.message + '）', 'err');
    }
  } else {
    toast('LocalStorageに保存しました（R2未設定）');
  }
});

document.getElementById('testUploadApiBtn').addEventListener('click', async () => {
  if (!cfg.r2AccountId || !cfg.r2Bucket) {
    toast('R2設定でAccount IDとバケット名を確認してください', 'err'); return;
  }
  // Unique URL per test to bypass browser preflight cache
  const url = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/_cors_test_${Date.now()}`;
  const btn = document.getElementById('testUploadApiBtn');
  btn.disabled = true; btn.textContent = '確認中…';

  // Step 1: simple PUT (no Authorization) to isolate Authorization-specific issue
  let simpleOk = false, simpleErr = '';
  try {
    const r = await fetch(url, {
      method: 'PUT',
      mode: 'cors',
      headers: { 'Content-Type': 'audio/mpeg' },
      body: new Uint8Array(0)
    });
    simpleOk = true; simpleErr = `HTTP ${r.status}`;
  } catch (e) { simpleErr = e.message; }

  // Step 2: PUT with all signed headers (this should match the real upload)
  let authOk = false, authErr = '';
  try {
    const r = await fetch(url + '_auth', {
      method: 'PUT',
      mode: 'cors',
      headers: {
        'Content-Type': 'audio/mpeg',
        'x-amz-date': '20240101T000000Z',
        'x-amz-content-sha256': 'UNSIGNED-PAYLOAD',
        'Authorization': 'AWS4-HMAC-SHA256 Credential=test/20240101/auto/s3/aws4_request, SignedHeaders=content-type;host;x-amz-content-sha256;x-amz-date, Signature=0000'
      },
      body: new Uint8Array(0)
    });
    authOk = true; authErr = `HTTP ${r.status}`;
  } catch (e) { authErr = e.message; }

  if (authOk) {
    toast(`CORS OK（${authErr}）— アップロード可能な状態です`);
  } else {
    alert(`接続テスト結果\n\nバケット URL: ${url}\nOrigin: ${location.origin}\n\n[1] PUT (Content-Type のみ): ${simpleOk ? 'OK ' + simpleErr : '失敗 ' + simpleErr}\n[2] PUT (Authorization 含む): ${authOk ? 'OK ' + authErr : '失敗 ' + authErr}\n\n[2] のみ失敗する場合 → R2 CORS の AllowedHeaders に "authorization" が無いか、保存されていない可能性があります。\n[1] [2] 両方失敗する場合 → CORS そのものが未設定、または Origin が許可されていません。`);
  }
  btn.disabled = false; btn.textContent = '接続テスト';
});

let selectedFiles = [];
let lessonNums = [];

function guessLessonNum(filename, fallback) {
  const m = filename.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : fallback;
}

const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');
fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
fileDrop.addEventListener('drop', e => { e.preventDefault(); fileDrop.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(fileList) {
  const sorted = Array.from(fileList).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  selectedFiles = await Promise.all(sorted.map(async f => ({
    name: f.name,
    data: new Uint8Array(await f.arrayBuffer())
  })));
  lessonNums = selectedFiles.map((f, i) => guessLessonNum(f.name, i + 1));
  renderPreview();
}

function getUploadPath(idx) {
  const y = cfg.years.find(x => x.id === document.getElementById('upYear').value);
  const t = cfg.terms.find(x => x.id === document.getElementById('upTerm').value);
  const l = cfg.levels.find(x => x.id === document.getElementById('upLevel').value);
  if (!y || !t || !l) return null;
  return `${y.tag}/${t.tag}/${l.tag}/lesson${lessonNums[idx]}.mp3`;
}

function renderPreview() {
  const sec = document.getElementById('previewSection');
  if (!selectedFiles.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  const body = document.getElementById('previewBody');
  body.innerHTML = selectedFiles.map((f, i) => {
    const path = getUploadPath(i) || '（年度・学期・レベルを選択してください）';
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(f.name)}</td>
      <td><input type="number" min="1" class="lesson-num-input" value="${lessonNums[i]}" data-idx="${i}"></td>
      <td class="preview-path" id="pp${i}">${path}</td>
    </tr>`;
  }).join('');
  body.querySelectorAll('.lesson-num-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      lessonNums[idx] = Math.max(1, parseInt(e.target.value) || 1);
      const el = document.getElementById(`pp${idx}`);
      if (el) el.textContent = getUploadPath(idx) || '（未選択）';
    });
  });
}

['upYear','upTerm','upLevel'].forEach(id => document.getElementById(id).addEventListener('change', () => {
  renderPreview();
}));

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const y = cfg.years.find(x => x.id === document.getElementById('upYear').value);
  const t = cfg.terms.find(x => x.id === document.getElementById('upTerm').value);
  const l = cfg.levels.find(x => x.id === document.getElementById('upLevel').value);
  if (!y || !t || !l) { toast('年度・学期・レベルを選択してください', 'err'); return; }
  if (!selectedFiles.length) { toast('ファイルを選択してください', 'err'); return; }
  const useWorker = !!cfg.r2WorkerUrl;
  if (!useWorker && (!cfg.r2AccountId || !cfg.r2AccessKeyId || !cfg.r2SecretKey)) { toast('R2設定が未完了です（Worker URLかS3認証情報を入力してください）', 'err'); return; }

  const prog = document.getElementById('uploadProgress');
  const bar  = document.getElementById('progressBar');
  const txt  = document.getElementById('progressText');
  prog.style.display = 'block';
  document.getElementById('uploadBtn').disabled = true;
  let ok = 0, fail = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    const key  = `${y.tag}/${t.tag}/${l.tag}/lesson${lessonNums[i]}.mp3`;
    const url  = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/${key}`;
    txt.textContent = `${i+1} / ${selectedFiles.length} — ${esc(file.name)}`;
    try {
      const res = useWorker
        ? await putViaWorker(key, file.data, 'audio/mpeg')
        : await signedPut(url, file.data, 'audio/mpeg');
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${body.slice(0, 200)}`);
      }
      ok++;
    } catch (e) {
      fail++;
      console.error('Upload error:', e, 'URL:', useWorker ? `${cfg.r2WorkerUrl}/${key}` : url);
      toast(`${file.name}: ${e.message}`, 'err');
    }
    bar.style.width = ((i+1) / selectedFiles.length * 100) + '%';
  }
  txt.textContent = `完了: ${ok} 件${fail ? ' / 失敗: '+fail+' 件' : ''}`;
  document.getElementById('uploadBtn').disabled = false;
  if (!fail) toast(`${ok} 件アップロード完了`);
});

/* ── Pure-JS SHA-256 / HMAC fallback (for non-HTTPS contexts) ── */
function _sha256(data) {
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bl = data.length * 8;
  const pl = ((data.length + 9 + 63) & ~63) - data.length;
  const m = new Uint8Array(data.length + pl);
  m.set(data); m[data.length] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(m.length - 8, Math.floor(bl / 0x100000000), false);
  dv.setUint32(m.length - 4, bl >>> 0, false);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < m.length; i += 64) {
    const W = new Uint32Array(64);
    for (let j = 0; j < 16; j++) W[j] = dv.getUint32(i + j * 4, false);
    for (let j = 16; j < 64; j++) {
      const s0 = r(W[j-15],7) ^ r(W[j-15],18) ^ (W[j-15]>>>3);
      const s1 = r(W[j-2],17) ^ r(W[j-2],19) ^ (W[j-2]>>>10);
      W[j] = (W[j-16] + s0 + W[j-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let j = 0; j < 64; j++) {
      const S1 = r(e,6)^r(e,11)^r(e,25), ch = (e&f)^(~e&g);
      const t1 = (h + S1 + ch + K[j] + W[j]) >>> 0;
      const S0 = r(a,2)^r(a,13)^r(a,22), maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H = [H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);
  }
  const out = new Uint8Array(32); const ov = new DataView(out.buffer);
  H.forEach((v,i) => ov.setUint32(i*4, v, false));
  return out;
}
function _hmac(key, data) {
  if (key.length > 64) key = _sha256(key);
  const ik = new Uint8Array(64), ok = new Uint8Array(64);
  ik.set(key); ok.set(key);
  for (let i = 0; i < 64; i++) { ik[i] ^= 0x36; ok[i] ^= 0x5c; }
  const inner = new Uint8Array(64 + data.length);
  inner.set(ik); inner.set(data, 64);
  const outer = new Uint8Array(96);
  outer.set(ok); outer.set(_sha256(inner), 64);
  return _sha256(outer);
}
const _hasCrypto = typeof crypto !== 'undefined' && crypto.subtle;

/* ── AWS Signature V4 ── */
async function sha256hex(data) {
  const buf = typeof data === 'string' ? new TextEncoder().encode(data) : data;
  if (_hasCrypto) {
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  return Array.from(_sha256(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hmacBytes(keyMat, msg) {
  const key  = keyMat instanceof Uint8Array ? keyMat : new TextEncoder().encode(keyMat);
  const data = new TextEncoder().encode(msg);
  if (_hasCrypto) {
    const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
  }
  return _hmac(key, data);
}
async function hmacHex(keyMat, msg) {
  return Array.from(await hmacBytes(keyMat, msg)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function putViaWorker(key, body, contentType) {
  const base = cfg.r2WorkerUrl.replace(/\/$/, '');
  return fetch(`${base}/${key}`, {
    method: 'PUT',
    headers: { 'Content-Type': contentType },
    body: body instanceof Uint8Array ? new Blob([body], { type: contentType }) : body
  });
}

async function signedPut(url, body, contentType) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ds  = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}`;
  const amz = `${ds}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const region = 'auto', service = 's3';
  const u = new URL(url);
  let bodyBlob;
  if (body instanceof Blob) bodyBlob = body;
  else if (body instanceof Uint8Array) bodyBlob = new Blob([body], { type: contentType });
  else bodyBlob = new Blob([new TextEncoder().encode(body)], { type: contentType });
  const payHash = 'UNSIGNED-PAYLOAD';
  const canonHeaders = `content-type:${contentType}\nhost:${u.hostname}\nx-amz-content-sha256:${payHash}\nx-amz-date:${amz}\n`;
  const signedHdrs   = 'content-type;host;x-amz-content-sha256;x-amz-date';
  const canonReq     = `PUT\n${u.pathname}\n\n${canonHeaders}\n${signedHdrs}\n${payHash}`;
  const credScope    = `${ds}/${region}/${service}/aws4_request`;
  const sts          = `AWS4-HMAC-SHA256\n${amz}\n${credScope}\n${await sha256hex(canonReq)}`;
  const kDate = await hmacBytes('AWS4' + cfg.r2SecretKey, ds);
  const kReg  = await hmacBytes(kDate, region);
  const kSvc  = await hmacBytes(kReg, service);
  const kSign = await hmacBytes(kSvc, 'aws4_request');
  const sig   = await hmacHex(kSign, sts);
  return fetch(url, {
    method: 'PUT',
    mode: 'cors',
    headers: {
      'Authorization': `AWS4-HMAC-SHA256 Credential=${cfg.r2AccessKeyId}/${credScope}, SignedHeaders=${signedHdrs}, Signature=${sig}`,
      'x-amz-date': amz, 'x-amz-content-sha256': payHash, 'Content-Type': contentType
    },
    body: bodyBlob
  });
}

/* ── Content list ── */
function mk(yId, tId, lId, n) { return `${yId}_${tId}_${lId}_${n}`; }
function allRows() {
  const rows = [];
  for (const y of cfg.years)
    for (const t of cfg.terms)
      for (const l of cfg.levels)
        for (let n = 1; n <= t.lessons; n++)
          rows.push({ y, t, l, n, key: mk(y.id, t.id, l.id, n) });
  return rows;
}
function audioUrl(y, t, l, n) { return `${cfg.r2BaseUrl}/${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`; }
function qrUrl(y, t, l, n)    { return `${BASE_URL}/?year=${y.id}&term=${t.id}&level=${l.id}&lesson=${n}`; }

let _clFiltersReady = false;
function populateClFilters() {
  const yS = document.getElementById('clYear');
  const tS = document.getElementById('clTerm');
  const lS = document.getElementById('clLevel');
  const yv = yS.value, tv = tS.value, lv = lS.value;
  yS.innerHTML = cfg.years.map(y  => `<option value="${y.id}">${y.name}</option>`).join('');
  tS.innerHTML = cfg.terms.map(t  => `<option value="${t.id}">${t.name}</option>`).join('');
  lS.innerHTML = cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  if (yv) yS.value = yv;
  if (tv) tS.value = tv;
  if (lv) lS.value = lv;
  if (!_clFiltersReady) {
    ['clYear','clTerm','clLevel'].forEach(id =>
      document.getElementById(id).addEventListener('change', renderContentList)
    );
    _clFiltersReady = true;
  }
}

function renderContentList() {
  if (!_clFiltersReady) populateClFilters();
  const yF = document.getElementById('clYear').value;
  const tF = document.getElementById('clTerm').value;
  const lF = document.getElementById('clLevel').value;
  const rows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  const con = document.getElementById('contentListTable');
  if (!rows.length) { con.innerHTML = '<div class="msg-c">コンテンツがありません</div>'; return; }
  let h = '<table class="cl"><thead><tr><th>講</th><th>操作</th></tr></thead><tbody>';
  for (const r of rows) {
    h += `<tr><td>第${r.n}講</td><td class="ops">
      <button class="btn btn-navy" id="clplay-${r.key}" style="font-size:.75rem;height:32px;opacity:.35;" disabled onclick="openPlayer('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})">▶ 再生</button>
      <button class="btn btn-ghost" style="font-size:.75rem;height:32px;" onclick="openQr('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})">QR</button>
    </td></tr>`;
  }
  con.innerHTML = h + '</tbody></table>';
  if (cfg.r2BaseUrl) {
    rows.forEach(r => {
      fetch(audioUrl(r.y, r.t, r.l, r.n), { method: 'HEAD' }).then(res => {
        if (res.ok) {
          const btn = document.getElementById(`clplay-${r.key}`);
          if (btn) { btn.disabled = false; btn.style.opacity = ''; }
        }
      }).catch(() => {});
    });
  }
}

document.getElementById('saveTitlesBtn').addEventListener('click', async () => {
  document.querySelectorAll('.lt-input').forEach(inp => {
    const key = inp.dataset.key;
    const val = inp.value.trim();
    if (val) cfg.lessonTitles[key] = val;
    else delete cfg.lessonTitles[key];
  });
  persistLocal();
  const json = JSON.stringify({ r2BaseUrl: cfg.r2BaseUrl, years: cfg.years, terms: cfg.terms, levels: cfg.levels, defaultYear: cfg.defaultYear, defaultTerm: cfg.defaultTerm, defaultLevel: cfg.defaultLevel, lessonTitles: cfg.lessonTitles }, null, 2);
  if (cfg.r2WorkerUrl || (cfg.r2AccountId && cfg.r2AccessKeyId && cfg.r2SecretKey && cfg.r2Bucket)) {
    try {
      let res;
      if (cfg.r2WorkerUrl) {
        res = await putViaWorker('settings.json', json, 'application/json');
      } else {
        const url = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/settings.json`;
        res = await signedPut(url, json, 'application/json');
      }
      if (!res.ok) throw new Error(res.status);
      toast('タイトルを保存しました（LocalStorage + R2）');
    } catch (e) {
      toast('LocalStorageに保存しました（R2アップロード失敗: ' + e.message + '）', 'err');
    }
  } else {
    toast('LocalStorageに保存しました（R2未設定）');
  }
});

/* ── Player ── */
const audio    = document.getElementById('audio');
const pOverlay = document.getElementById('playerOverlay');

function fmt(s) { return isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00'; }
function updProg() {
  const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  document.getElementById('progFill').style.width = p + '%';
  document.getElementById('progThumb').style.left = p + '%';
  document.getElementById('curTime').textContent = fmt(audio.currentTime);
}
audio.addEventListener('timeupdate', updProg);
audio.addEventListener('loadedmetadata', () => { document.getElementById('durTime').textContent = fmt(audio.duration); updProg(); });
audio.addEventListener('ended', () => setPI(false));

function setPI(playing) {
  document.getElementById('iconPlay').style.display  = playing ? 'none' : '';
  document.getElementById('iconPause').style.display = playing ? '' : 'none';
}
document.getElementById('btnPlay').addEventListener('click', () => {
  if (audio.paused) { audio.play(); setPI(true); } else { audio.pause(); setPI(false); }
});
document.getElementById('btnStop').addEventListener('click', () => { audio.pause(); audio.currentTime = 0; setPI(false); updProg(); });
document.getElementById('btnBack').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('btnFwd').addEventListener('click',  () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime+10); });

let seeking = false;
function seekTo(cx) {
  const r = document.getElementById('progWrap').getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (cx - r.left) / r.width));
  if (audio.duration) audio.currentTime = p * audio.duration;
  updProg();
}
const pw = document.getElementById('progWrap');
pw.addEventListener('mousedown',  e => { seeking = true; seekTo(e.clientX); });
window.addEventListener('mousemove', e => { if (seeking) seekTo(e.clientX); });
window.addEventListener('mouseup',   () => { seeking = false; });
pw.addEventListener('touchstart', e => { seeking = true; seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchmove', e => { if (seeking) seekTo(e.touches[0].clientX); }, { passive: true });
window.addEventListener('touchend',  () => { seeking = false; });

function setSpeed(v) {
  audio.playbackRate = v;
  document.getElementById('speedSlider').value = v;
  document.getElementById('speedVal').textContent = (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,'') + 'x';
  document.querySelectorAll('.btn-preset').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === v));
}
document.getElementById('speedSlider').addEventListener('input', e => setSpeed(parseFloat(e.target.value)));
document.querySelectorAll('.btn-preset').forEach(b => b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
if (isIOS) { document.getElementById('volRow').style.display = 'none'; document.getElementById('volNote').style.display = 'block'; }
else { document.getElementById('volSlider').addEventListener('input', e => { audio.volume = parseFloat(e.target.value); }); }

function openPlayer(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  document.getElementById('playerTitle').textContent = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  audio.src = audioUrl(y, t, l, n);
  audio.currentTime = 0; setPI(false);
  document.getElementById('durTime').textContent = '0:00';
  document.getElementById('curTime').textContent = '0:00';
  setSpeed(1);
  pOverlay.classList.add('open');
}
function closePlayer() { audio.pause(); pOverlay.classList.remove('open'); }
document.getElementById('btnClose').addEventListener('click', closePlayer);
pOverlay.addEventListener('click', e => { if (e.target === pOverlay) closePlayer(); });

/* ── QR ── */
const qrOverlay = document.getElementById('qrOverlay');

function openQr(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  const url = qrUrl(y, t, l, n);
  document.getElementById('qrTitle').textContent = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  document.getElementById('qrUrlText').textContent = url;
  const canvas = document.getElementById('qrCanvas');
  canvas.innerHTML = '';
  new QRCode(canvas, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('btnCopyUrl').onclick = () => {
    navigator.clipboard.writeText(url)
      .then(() => toast('URLをコピーしました'))
      .catch(() => toast('コピーできませんでした', 'err'));
  };
  qrOverlay.classList.add('open');
}
document.getElementById('qrClose').addEventListener('click', () => qrOverlay.classList.remove('open'));
qrOverlay.addEventListener('click', e => { if (e.target === qrOverlay) qrOverlay.classList.remove('open'); });

/* ── Init ── */
async function init() {
  await loadAllSettings();
  renderYearList();
  renderTermList();
  renderLevelList();
  loadR2Fields();
  const savedTab = localStorage.getItem('dke_active_tab');
  if (savedTab) switchTab(savedTab);
}
init();
</script>
