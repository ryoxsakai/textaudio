<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>設定 | DKE Medical English</title>
  <link rel="apple-touch-icon" href="../icon2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #5B8DEF; --primary-dk: #3F73D6; --primary-lt: #EAF1FE;
      --grad: linear-gradient(135deg, #5B8DEF 0%, #8B7FE8 100%);
      --green: #3FB984;   --red: #E07A7A;
      --border: #DCE6F4; --bg: #F3F7FC; --text: #28324A; --muted: #95A3BA;
    }
    body { font-family: "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .lt-input { background: var(--primary-lt) !important; border-color: var(--border) !important; color: var(--text) !important; }

    .app-header { background-color: #6E8FE8; background-image: linear-gradient(120deg, rgba(74,116,222,.34) 0%, rgba(150,124,214,.1) 100%), url('../bg.png'); background-size: cover, cover; background-position: center, center 18%; background-repeat: no-repeat, no-repeat; color: #fff; padding: 0 18px; height: 60px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 18px rgba(91,141,239,.28); }
    .app-header a { color: rgba(255,255,255,.85); text-decoration: none; font-size: 1.2rem; }
    .app-title { font-size: 1.05rem; font-weight: 700; }

    .tab-nav { display: flex; background: #fff; border-bottom: 2px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 60px; z-index: 9; touch-action: pan-x; overscroll-behavior-x: contain; }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; padding: 14px 16px; font-size: .82rem; font-weight: 600; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; padding: 20px 16px 48px; }
    .tab-panel.active { display: block; }

    .sec-title { font-size: .9rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .sec-gap { margin-bottom: 28px; }

    .crud-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .crud-item { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 13px; box-shadow: 0 2px 10px rgba(80,120,200,.06); }
    .crud-fields { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .crud-field { display: flex; flex-direction: column; gap: 3px; }
    .crud-field.wide { flex: 1; min-width: 100px; }
    .crud-field.narrow { width: 72px; }
    .crud-field label { font-size: .7rem; color: var(--muted); }
    .crud-field input { height: 36px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; font-size: .85rem; width: 100%; }
    .crud-actions { display: flex; gap: 6px; justify-content: flex-end; }

    .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; cursor: pointer; font-size: .82rem; font-weight: 600; height: 36px; padding: 0 14px; min-width: 44px; -webkit-tap-highlight-color: transparent; transition: opacity .15s; white-space: nowrap; }
    .btn:active { opacity: .7; }
    .btn-navy  { background: var(--grad); color: #fff; box-shadow: 0 3px 12px rgba(91,141,239,.28); }
    .btn-ghost { background: var(--primary-lt); color: var(--primary); }
    .btn-red   { background: #FCEAEA; color: var(--red); }
    .btn-add   { background: var(--primary-lt); color: var(--primary); border: 1.5px dashed var(--primary); width: 100%; height: 42px; border-radius: 12px; }

    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-label { font-size: .8rem; font-weight: 600; color: var(--text); }
    .form-input { height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px; font-size: .9rem; width: 100%; background: #fff; }
    .form-hint { font-size: .72rem; color: var(--muted); }
    .btn-save { width: 100%; height: 48px; font-size: .95rem; font-weight: 700; border-radius: 12px; margin-top: 8px; }

    /* Upload */
    .upload-select-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .upload-select-row select { flex: 1 1 calc(33% - 8px); min-width: 100px; height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; font-size: .875rem; background: #fff; }
    .file-drop { border: 2px dashed var(--border); border-radius: 12px; background: #fff; padding: 24px; text-align: center; cursor: pointer; margin-bottom: 14px; color: var(--muted); font-size: .875rem; transition: border-color .15s; }
    .file-drop.drag-over { border-color: var(--primary); background: var(--primary-lt); }
    #fileInput { display: none; }
    .preview-wrap { overflow-x: auto; margin-bottom: 14px; }
    .preview-table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 380px; }
    .preview-table th { background: var(--primary); color: #fff; padding: 8px 10px; text-align: left; }
    .preview-table td { padding: 7px 10px; border-bottom: 1px solid #f0f2f6; vertical-align: middle; }
    .preview-table tr:last-child td { border-bottom: none; }
    .preview-path { color: var(--primary); font-family: monospace; font-size: .78rem; }
    .lesson-num-input { width: 60px; height: 32px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: .85rem; padding: 0 4px; }
    .progress-wrap { background: #e2e6ea; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar { height: 100%; background: var(--primary); border-radius: 6px; transition: width .2s; }
    .progress-text { font-size: .8rem; color: var(--muted); text-align: center; }

    /* Content list */
    .cl-scroll { overflow-x: auto; }
    table.cl { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(74,134,200,.1); }
    table.cl thead th { background: var(--primary); color: #fff; padding: 11px 12px; text-align: left; font-size: .78rem; }
    table.cl tbody td { padding: 9px 12px; border-bottom: 1px solid #EDF4FB; font-size: .83rem; vertical-align: middle; }
    table.cl tbody tr:last-child td { border-bottom: none; }
    .ops { display: flex; gap: 6px; align-items: center; }
    /* Icon-only buttons for content list */
    .cl-icon-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; cursor: pointer; padding: 5px; border-radius: 6px; font-size: 1rem; min-width: 30px; min-height: 30px; -webkit-tap-highlight-color: transparent; transition: opacity .15s; }
    .cl-icon-btn:active { opacity: .55; }
    .cl-icon-btn.cl-play { color: var(--primary); }
    .cl-icon-btn.cl-qr  { color: var(--muted); }
    .cl-icon-btn.cl-del { color: var(--red); }
    .cl-icon-btn:disabled { opacity: .25; pointer-events: none; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px; font-size: .875rem; font-weight: 600; z-index: 9999; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.15); animation: slideUp .25s ease; }
    .toast.ok  { background: #2e7d32; color: #fff; }
    .toast.err { background: #c62828; color: #fff; }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* Overlay / Sheet */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; align-items: center; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { width: 92%; max-width: 480px; max-height: 90dvh; background: #fff; border-radius: 16px; padding: 20px 20px 28px; overflow-y: auto; }
    .sheet.qr-sheet { max-width: 340px; }

    /* Player */
    .pl-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .pl-title { font-size: .95rem; font-weight: 700; color: var(--primary); line-height: 1.4; flex: 1; padding-right: 12px; }
    .btn-close { width: 30px; height: 30px; border: none; background: var(--primary-lt); border-radius: 50%; font-size: .82rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--primary); }
    .prog-wrap { position: relative; height: 44px; display: flex; align-items: center; cursor: pointer; touch-action: none; user-select: none; }
    .wave-canvas { position: absolute; left: 0; width: 100%; height: 38px; top: 50%; transform: translateY(-50%); border-radius: 8px; background: var(--primary-lt); pointer-events: none; display: block; }
    .prog-thumb { position: absolute; width: 18px; height: 18px; background: var(--primary); border-radius: 50%; top: 50%; left: 0; transform: translate(-50%,-50%); box-shadow: 0 1px 4px rgba(74,134,200,.4); z-index: 2; }
    .time-row { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); margin-bottom: 16px; }
    #vizCanvas { width: 100%; height: 68px; display: block; border-radius: 10px; background: var(--primary-lt); margin-bottom: 16px; }
    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .ctrl-btn { display: flex; align-items: center; justify-content: center; border: none; background: none; border-radius: 50%; min-width: 46px; min-height: 46px; cursor: pointer; color: var(--primary); font-size: 1.3rem; -webkit-tap-highlight-color: transparent; transition: background .15s; }
    .ctrl-btn:active { background: var(--primary-lt); }
    .ctrl-btn-main { background: var(--grad); color: #fff; min-width: 64px; min-height: 64px; font-size: 1.5rem; box-shadow: 0 6px 20px rgba(91,141,239,.38); }
    .ctrl-btn-main:active { opacity: .92; }
    .btn-preset { border: 1.5px solid var(--border); background: #fff; color: var(--muted); font-size: .77rem; font-weight: 600; padding: 6px 10px; border-radius: 20px; cursor: pointer; min-height: 34px; -webkit-tap-highlight-color: transparent; transition: all .15s; }
    .btn-preset.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .btn-preset:active { opacity: .7; }

    /* Level override modal */
    .lvl-ov-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
    .lvl-ov-row:last-child { border-bottom:none; }
    .lvl-ov-name { flex:1; font-size:.88rem; color:var(--text); }
    .lvl-ov-def  { font-size:.76rem; color:var(--muted); white-space:nowrap; }
    .lvl-ov-input { width:68px; text-align:center; border:1.5px solid var(--border); border-radius:8px; padding:6px 8px; font-size:.88rem; font-family:inherit; color:var(--text); }

    /* QR */
    .qr-sheet { text-align: center; }
    .qr-sub { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
    #qrCanvas { display: inline-block; margin-bottom: 14px; }
    .qr-url { font-size: .72rem; color: var(--primary); word-break: break-all; margin-bottom: 14px; line-height: 1.5; }

    .msg-c { text-align: center; padding: 32px 20px; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>

<header class="app-header">
  <a href="../"><i class="fas fa-arrow-left"></i></a>
  <span class="app-title"><i class="fas fa-gear"></i> 設定</span>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="t1"><i class="fas fa-sliders fa-fw"></i> コンテンツ設定</button>
  <button class="tab-btn" data-tab="t2"><i class="fas fa-cloud fa-fw"></i> R2設定</button>
  <button class="tab-btn" data-tab="t3"><i class="fas fa-upload fa-fw"></i> アップロード</button>
  <button class="tab-btn" data-tab="t4"><i class="fas fa-table-list fa-fw"></i> コンテンツ一覧</button>
</nav>

<!-- Tab1: コンテンツ設定 -->
<div class="tab-panel active" id="t1">
  <div class="sec-gap">
    <div class="sec-title"><i class="fas fa-globe fa-fw"></i> サイト設定</div>
    <div class="form-row">
      <label class="form-label"><i class="fas fa-heading fa-fw"></i> サイトタイトル</label>
      <input class="form-input" id="siteTitleInput" type="text" placeholder="DKE Medical English">
      <span class="form-hint">ユーザーページのヘッダーに表示されるタイトル</span>
    </div>
  </div>
  <div class="sec-gap">
    <div class="sec-title"><i class="fas fa-calendar-days fa-fw"></i> 年度の設定</div>
    <div class="crud-list" id="yearList"></div>
    <button class="btn btn-add" id="addYearBtn"><i class="fas fa-plus"></i> 年度を追加</button>
  </div>
  <div class="sec-gap">
    <div class="sec-title"><i class="fas fa-layer-group fa-fw"></i> 学期の設定</div>
    <div class="crud-list" id="termList"></div>
    <button class="btn btn-add" id="addTermBtn"><i class="fas fa-plus"></i> 学期を追加</button>
  </div>
  <div class="sec-gap">
    <div class="sec-title"><i class="fas fa-signal fa-fw"></i> レベルの設定</div>
    <div class="crud-list" id="levelList"></div>
    <button class="btn btn-add" id="addLevelBtn"><i class="fas fa-plus"></i> レベルを追加</button>
  </div>
  <button class="btn btn-navy btn-save" id="saveContentBtn"><i class="fas fa-floppy-disk"></i> 保存する</button>
  <div id="contentStatus" style="margin-top:10px;font-size:.75rem;color:var(--muted);text-align:center;min-height:18px;"></div>
</div>

<!-- Tab2: R2設定 -->
<div class="tab-panel" id="t2">
  <div class="form-row">
    <label class="form-label"><i class="fas fa-link fa-fw"></i> R2 ベースURL（公開URL）</label>
    <input class="form-input" id="r2BaseUrl" type="url" placeholder="https://pub-xxxx.r2.dev">
    <span class="form-hint">音声ファイルの公開ベースURL</span>
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-id-card fa-fw"></i> Account ID</label>
    <input class="form-input" id="r2AccountId" type="text" placeholder="Cloudflare Account ID">
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-key fa-fw"></i> Access Key ID</label>
    <input class="form-input" id="r2AccessKeyId" type="password" placeholder="R2 Access Key ID">
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-lock fa-fw"></i> Secret Access Key</label>
    <input class="form-input" id="r2SecretKey" type="password" placeholder="R2 Secret Access Key">
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-database fa-fw"></i> バケット名</label>
    <input class="form-input" id="r2Bucket" type="text" value="textaudio">
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-bolt fa-fw"></i> Worker URL <span style="font-weight:400;color:var(--muted)">（アップロード用・任意）</span></label>
    <input class="form-input" id="r2WorkerUrl" type="url" placeholder="https://textaudio-upload.xxxxx.workers.dev">
    <div class="form-hint">Cloudflare Worker 経由でアップロードする場合に入力。設定すると AWS 署名不要になります。</div>
  </div>
  <div class="form-row">
    <label class="form-label"><i class="fas fa-globe fa-fw"></i> サイトURL <span style="font-weight:400;color:var(--muted)">（QRコード用）</span></label>
    <input class="form-input" id="siteUrl" type="url" placeholder="https://audio.lrnr.jp">
    <div class="form-hint">QRコードに埋め込むサイトのベースURL。未設定の場合はデフォルト値を使用。</div>
  </div>
  <div style="display:flex;gap:10px;margin-top:4px;">
    <button class="btn btn-ghost" id="testConnBtn" style="flex:1;height:44px;"><i class="fas fa-plug fa-fw"></i> 接続テスト</button>
    <button class="btn btn-navy btn-save" id="saveR2Btn" style="flex:2;"><i class="fas fa-floppy-disk fa-fw"></i> 保存する</button>
  </div>
</div>

<!-- Tab3: ファイルアップロード -->
<div class="tab-panel" id="t3">
  <div class="upload-select-row">
    <select id="upYear"><option value="">年度を選択</option></select>
    <select id="upTerm"><option value="">学期を選択</option></select>
    <select id="upLevel"><option value="">レベルを選択</option></select>
  </div>

  <div class="file-drop" id="fileDrop">
    <div>タップまたはドラッグでMP3を選択</div>
    <div style="font-size:.75rem;margin-top:4px;">複数選択可・ファイル名の数字を講番号に自動反映</div>
    <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple>
  </div>
  <div id="previewSection" style="display:none">
    <div class="preview-wrap">
      <table class="preview-table">
        <thead><tr><th>#</th><th>元のファイル名</th><th>講番号</th><th>アップロード先</th></tr></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>
    <button class="btn btn-navy btn-save" id="uploadBtn"><i class="fas fa-cloud-arrow-up fa-fw"></i> アップロード開始</button>
    <div id="uploadProgress" style="display:none;margin-top:14px;">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>
    </div>
  </div>
</div>

<!-- Tab4: コンテンツ一覧 -->
<div class="tab-panel" id="t4">
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
    <select id="clYear" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
    <select id="clTerm" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
    <select id="clLevel" style="flex:1 1 calc(33% - 8px);min-width:100px;height:38px;padding:0 8px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;"></select>
  </div>
  <div class="cl-scroll"><div id="contentListTable"><div class="msg-c">読み込み中…</div></div></div>
  <button class="btn btn-navy btn-save" id="saveTitlesBtn" style="margin-top:14px;"><i class="fas fa-floppy-disk fa-fw"></i> タイトルを保存する</button>
</div>

<!-- Level lessons override overlay -->
<div class="overlay" id="lvlOverlayDiv">
  <div class="sheet" style="max-width:400px;">
    <div class="pl-header">
      <div class="pl-title" id="lvlOverlayTitle">特殊講数設定</div>
      <button class="btn-close" id="lvlOverlayClose"><i class="fas fa-xmark"></i></button>
    </div>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:16px;">空欄にすると各学期の標準講数を使用します</p>
    <div id="lvlOverlayList"></div>
    <button class="btn btn-navy" id="lvlOverlaySave" style="width:100%;height:44px;margin-top:16px;font-size:.875rem;">保存</button>
  </div>
</div>

<!-- Player overlay -->
<div class="overlay" id="playerOverlay">
  <div class="sheet">
    <div class="pl-header">
      <div class="pl-title" id="playerTitle">-</div>
      <button class="btn-close" id="btnClose"><i class="fas fa-xmark"></i></button>
    </div>
    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <div class="prog-wrap" id="progWrap">
      <canvas id="waveCanvas" class="wave-canvas"></canvas>
      <div class="prog-thumb" id="progThumb"></div>
    </div>
    <div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
    <canvas id="vizCanvas"></canvas>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnBack" title="10秒戻る"><i class="fas fa-rotate-left"></i></button>
      <button class="ctrl-btn ctrl-btn-main" id="btnPlay"><i class="fas fa-play" id="iconPlay"></i></button>
      <button class="ctrl-btn" id="btnFwd" title="10秒進む"><i class="fas fa-rotate-right"></i></button>
    </div>
    <div class="speed-section" style="margin-bottom:16px;">
      <div class="speed-label" style="font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:8px;letter-spacing:.04em;">再生速度</div>
      <div class="speed-preset-row" style="display:flex;gap:6px;justify-content:center;">
        <button class="btn-preset" data-speed="0.75">0.75x</button>
        <button class="btn-preset active" data-speed="1">1.0x</button>
        <button class="btn-preset" data-speed="1.25">1.25x</button>
        <button class="btn-preset" data-speed="1.5">1.5x</button>
        <button class="btn-preset" data-speed="2">2.0x</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;">
      <button class="ctrl-btn" id="btnPrevLesson" style="min-width:40px;min-height:40px;font-size:1.1rem;" title="前の講" disabled><i class="fas fa-backward-step"></i></button>
      <span id="navLabel" style="font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.04em;"></span>

<div class="overlay" id="qrOverlay">
  <div class="sheet qr-sheet">

  </div>
</div>

<script>
const SK = 'dke_settings';
const BASE_URL = 'https://audio.lrnr.jp';
const DEFAULTS = {
  r2BaseUrl: 'https://textaudio.ryoxsakai.workers.dev',
  years:  [{ id: 'y1', name: '2026年度', tag: '2026' }],
  terms:  [{ id: 't1', name: '前期', tag: 'term1', lessons: 3 }, { id: 't2', name: '夏期', tag: 'term2', lessons: 2 }],
  levels: [{ id: 'l1', name: 'High 読解', tag: 'high_reading' }, { id: 'l2', name: 'High 構文', tag: 'high_structure' }, { id: 'l3', name: 'Standard 読解', tag: 'standard_reading' }, { id: 'l4', name: 'Standard 構文', tag: 'standard_structure' }]
};

let cfg = {
  r2BaseUrl: '', r2AccountId: '', r2AccessKeyId: '', r2SecretKey: '', r2Bucket: 'textaudio',
  r2WorkerUrl: '', siteUrl: '', siteTitle: '',
  years: [], terms: [], levels: [],
  defaultYear: '', defaultTerm: '', defaultLevel: '',
  lessonTitles: {}
};

/* ── Toast ── */
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ── Tabs ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function switchTab(tabId) {
  const btn = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tabId).classList.add('active');
  localStorage.setItem('dke_active_tab', tabId);
  if (tabId === 't4') renderContentList();
  if (tabId === 't3') populateUploadSelects();
}

/* ── Load settings ── */
async function loadAllSettings() {
  // 1. Always load credentials from localStorage (never from R2)
  let local = null;
  try { local = JSON.parse(localStorage.getItem(SK)); } catch {}
  cfg.r2AccountId   = local?.r2AccountId   || '';
  cfg.r2AccessKeyId = local?.r2AccessKeyId || '';
  cfg.r2SecretKey   = local?.r2SecretKey   || '';
  cfg.r2Bucket      = local?.r2Bucket      || 'textaudio';
  cfg.r2BaseUrl     = local?.r2BaseUrl     || DEFAULTS.r2BaseUrl;
  cfg.r2WorkerUrl   = local?.r2WorkerUrl   || '';
  cfg.siteUrl       = local?.siteUrl       || '';
  cfg.siteTitle     = local?.siteTitle     || '';
  // 2. Apply localStorage content settings as the starting point
  cfg.years        = local?.years?.length  ? local.years  : [...DEFAULTS.years];
  cfg.terms        = local?.terms?.length  ? local.terms  : [...DEFAULTS.terms];
  cfg.levels       = local?.levels?.length ? local.levels : [...DEFAULTS.levels];
  cfg.defaultYear  = local?.defaultYear  || '';
  cfg.defaultTerm  = local?.defaultTerm  || '';
  cfg.defaultLevel = local?.defaultLevel || '';
  cfg.lessonTitles = local?.lessonTitles || {};

  // 3. Try to overlay content settings from R2 (never touch credentials)
  const fetchUrls = [...new Set(
    [cfg.r2WorkerUrl, cfg.r2BaseUrl].filter(Boolean).map(u => u.replace(/\/$/, ''))
  )];
  for (const url of fetchUrls) {
    try {
      const r = await fetch(`${url}/settings.json`);
      if (!r.ok) continue;
      const j = await r.json();
      // Only override if R2 has actual data (non-empty)
      if (j.years?.length)  cfg.years  = j.years;
      if (j.terms?.length)  cfg.terms  = j.terms;
      if (j.levels?.length) cfg.levels = j.levels;
      if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
      if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
      if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
      if (j.lessonTitles && Object.keys(j.lessonTitles).length) cfg.lessonTitles = j.lessonTitles;
      // Propagate Worker/Base/Site URL from R2 only if not already in localStorage
      if (j.r2WorkerUrl && !local?.r2WorkerUrl) cfg.r2WorkerUrl = j.r2WorkerUrl;
      if (j.r2BaseUrl   && !local?.r2BaseUrl)   cfg.r2BaseUrl   = j.r2BaseUrl;
      if (j.siteUrl     && !local?.siteUrl)     cfg.siteUrl     = j.siteUrl;
      if (j.siteTitle   && !local?.siteTitle)   cfg.siteTitle   = j.siteTitle;
      break; // success — stop trying further URLs
    } catch {}
  }
  // Note: intentionally NO persistLocal() here — avoids overwriting credentials

  // Populate siteTitle input
  const siteTitleEl = document.getElementById('siteTitleInput');
  if (siteTitleEl) siteTitleEl.value = cfg.siteTitle || '';
  // Show load status
  const statusEl = document.getElementById('contentStatus');
  if (statusEl) {
    statusEl.textContent = `ロード済み: 年度${cfg.years.length}件 / 学期${cfg.terms.length}件 / レベル${cfg.levels.length}件`;
  }
}

function persistLocal() {
  localStorage.setItem(SK, JSON.stringify({
    r2BaseUrl: cfg.r2BaseUrl, r2AccountId: cfg.r2AccountId,
    r2AccessKeyId: cfg.r2AccessKeyId, r2SecretKey: cfg.r2SecretKey, r2Bucket: cfg.r2Bucket,
    r2WorkerUrl: cfg.r2WorkerUrl, siteUrl: cfg.siteUrl, siteTitle: cfg.siteTitle,
    years: cfg.years, terms: cfg.terms, levels: cfg.levels,
    defaultYear: cfg.defaultYear, defaultTerm: cfg.defaultTerm, defaultLevel: cfg.defaultLevel,
    lessonTitles: cfg.lessonTitles
  }));
  // Also write siteTitle to a quick-access key so the user page can apply it immediately
  if (cfg.siteTitle) localStorage.setItem('dke_site_title', cfg.siteTitle);
  else localStorage.removeItem('dke_site_title');
}

function settingsJson() {
  return JSON.stringify({
    r2BaseUrl: cfg.r2BaseUrl, r2WorkerUrl: cfg.r2WorkerUrl, siteUrl: cfg.siteUrl, siteTitle: cfg.siteTitle,
    years: cfg.years, terms: cfg.terms, levels: cfg.levels,
    defaultYear: cfg.defaultYear, defaultTerm: cfg.defaultTerm, defaultLevel: cfg.defaultLevel,
    lessonTitles: cfg.lessonTitles
  }, null, 2);
}

async function saveSettingsJson() {
  const json = settingsJson();
  if (cfg.r2WorkerUrl || (cfg.r2AccountId && cfg.r2AccessKeyId && cfg.r2SecretKey && cfg.r2Bucket)) {
    let res;
    if (cfg.r2WorkerUrl) {
      res = await putViaWorker('settings.json', json, 'application/json');
    } else {
      const url = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/settings.json`;
      res = await signedPut(url, json, 'application/json');
    }
    if (!res.ok) throw new Error(res.status);
  } else {
    throw new Error('R2未設定');
  }
}

/* ── CRUD helper ── */
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function makeCrudItem(fields, actions) {
  const div = document.createElement('div');
  div.className = 'crud-item';
  div.innerHTML = `<div class="crud-fields">${fields}</div><div class="crud-actions">${actions}</div>`;
  return div;
}

function setDefault(arr, id) {
  if (arr === 'years')  { cfg.defaultYear  = id; renderYearList(); }
  if (arr === 'terms')  { cfg.defaultTerm  = id; renderTermList(); }
  if (arr === 'levels') { cfg.defaultLevel = id; renderLevelList(); }
}

/* ── Year CRUD ── */
function renderYearList() {
  const el = document.getElementById('yearList');
  el.innerHTML = '';
  cfg.years.forEach((y, i) => {
    const isDef = cfg.defaultYear === y.id || (!cfg.defaultYear && i === 0);
    const div = makeCrudItem(
      `<div class="crud-field wide"><label>表示名</label><input type="text" value="${esc(y.name)}" data-field="name" data-arr="years" data-idx="${i}"></div>
       <div class="crud-field wide"><label>タグ（英字）</label><input type="text" value="${esc(y.tag)}" data-field="tag" data-arr="years" data-idx="${i}"></div>`,
      `<button class="btn ${isDef?'btn-navy':'btn-ghost'}" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="${isDef?'デフォルト（設定中）':'デフォルトに設定'}" onclick="setDefault('years','${y.id}')"><i class="${isDef?'fas':'far'} fa-star"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="上へ" onclick="moveArr('years',${i},-1,renderYearList)" ${i===0?'disabled':''}><i class="fas fa-chevron-up"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="下へ" onclick="moveArr('years',${i},1,renderYearList)" ${i===cfg.years.length-1?'disabled':''}><i class="fas fa-chevron-down"></i></button>
       <button class="btn btn-red"   style="height:32px;width:32px;padding:0;font-size:.9rem;" title="削除" onclick="delArr('years',${i},renderYearList)"><i class="fas fa-trash"></i></button>`
    );
    div.querySelectorAll('input').forEach(attachCrudInput);
    el.appendChild(div);
  });
}
document.getElementById('addYearBtn').addEventListener('click', () => {
  cfg.years.push({ id: 'y' + Date.now(), name: '', tag: '' });
  renderYearList();
});

/* ── Term CRUD ── */
function renderTermList() {
  const el = document.getElementById('termList');
  el.innerHTML = '';
  cfg.terms.forEach((t, i) => {
    const isDef = cfg.defaultTerm === t.id || (!cfg.defaultTerm && i === 0);
    const div = makeCrudItem(
      `<div class="crud-field wide"><label>表示名</label><input type="text" value="${esc(t.name)}" data-field="name" data-arr="terms" data-idx="${i}"></div>
       <div class="crud-field wide"><label>タグ（英字）</label><input type="text" value="${esc(t.tag)}" data-field="tag" data-arr="terms" data-idx="${i}"></div>
       <div class="crud-field narrow"><label>講数</label><input type="number" min="1" value="${t.lessons}" data-field="lessons" data-arr="terms" data-idx="${i}"></div>`,
      `<button class="btn ${isDef?'btn-navy':'btn-ghost'}" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="${isDef?'デフォルト（設定中）':'デフォルトに設定'}" onclick="setDefault('terms','${t.id}')"><i class="${isDef?'fas':'far'} fa-star"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="上へ" onclick="moveArr('terms',${i},-1,renderTermList)" ${i===0?'disabled':''}><i class="fas fa-chevron-up"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="下へ" onclick="moveArr('terms',${i},1,renderTermList)" ${i===cfg.terms.length-1?'disabled':''}><i class="fas fa-chevron-down"></i></button>
       <button class="btn btn-red"   style="height:32px;width:32px;padding:0;font-size:.9rem;" title="削除" onclick="delArr('terms',${i},renderTermList)"><i class="fas fa-trash"></i></button>`
    );
    div.querySelectorAll('input').forEach(attachCrudInput);
    el.appendChild(div);
  });
}
document.getElementById('addTermBtn').addEventListener('click', () => {
  cfg.terms.push({ id: 't' + Date.now(), name: '', tag: '', lessons: 1, levelLessons: {} });
  renderTermList();
});

/* ── Level CRUD ── */
function renderLevelList() {
  const el = document.getElementById('levelList');
  el.innerHTML = '';
  cfg.levels.forEach((l, i) => {
    const isDef = cfg.defaultLevel === l.id || (!cfg.defaultLevel && i === 0);
    const div = makeCrudItem(
      `<div class="crud-field wide"><label>表示名</label><input type="text" value="${esc(l.name)}" data-field="name" data-arr="levels" data-idx="${i}"></div>
       <div class="crud-field wide"><label>タグ（英字）</label><input type="text" value="${esc(l.tag)}" data-field="tag" data-arr="levels" data-idx="${i}"></div>`,
      `<button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="特殊講数設定" onclick="openLevelOverride('${l.id}')"><i class="fas fa-gear"></i></button>
       <button class="btn ${isDef?'btn-navy':'btn-ghost'}" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="${isDef?'デフォルト（設定中）':'デフォルトに設定'}" onclick="setDefault('levels','${l.id}')"><i class="${isDef?'fas':'far'} fa-star"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="上へ" onclick="moveArr('levels',${i},-1,renderLevelList)" ${i===0?'disabled':''}><i class="fas fa-chevron-up"></i></button>
       <button class="btn btn-ghost" style="height:32px;width:32px;padding:0;font-size:.9rem;" title="下へ" onclick="moveArr('levels',${i},1,renderLevelList)" ${i===cfg.levels.length-1?'disabled':''}><i class="fas fa-chevron-down"></i></button>
       <button class="btn btn-red"   style="height:32px;width:32px;padding:0;font-size:.9rem;" title="削除" onclick="delArr('levels',${i},renderLevelList)"><i class="fas fa-trash"></i></button>`
    );
    div.querySelectorAll('input').forEach(attachCrudInput);
    el.appendChild(div);
  });
}
document.getElementById('addLevelBtn').addEventListener('click', () => {
  cfg.levels.push({ id: 'l' + Date.now(), name: '', tag: '' });
  renderLevelList();
});

/* ── Level lessons override ── */
let lvlOverrideLevelId = null;
function openLevelOverride(levelId) {
  lvlOverrideLevelId = levelId;
  const level = cfg.levels.find(l => l.id === levelId);
  document.getElementById('lvlOverlayTitle').textContent = `「${level?.name || levelId}」特殊講数設定`;
  document.getElementById('lvlOverlayList').innerHTML = cfg.terms.map(t => {
    const ov = (t.levelLessons || {})[levelId];
    return `<div class="lvl-ov-row">
      <span class="lvl-ov-name">${esc(t.name || '（未設定）')}</span>
      <span class="lvl-ov-def">標準 ${t.lessons}講</span>
      <input class="lvl-ov-input" type="number" min="1" placeholder="${t.lessons}"
             value="${ov != null ? ov : ''}" id="lvlOv_${t.id}">
    </div>`;
  }).join('');
  document.getElementById('lvlOverlayDiv').classList.add('open');
}
function closeLevelOverride() {
  document.getElementById('lvlOverlayDiv').classList.remove('open');
  lvlOverrideLevelId = null;
}
document.getElementById('lvlOverlayClose').addEventListener('click', closeLevelOverride);
document.getElementById('lvlOverlayDiv').addEventListener('click', e => { if (e.target === document.getElementById('lvlOverlayDiv')) closeLevelOverride(); });
document.getElementById('lvlOverlaySave').addEventListener('click', () => {
  cfg.terms.forEach(t => {
    if (!t.levelLessons) t.levelLessons = {};
    const input = document.getElementById(`lvlOv_${t.id}`);
    if (!input) return;
    const val = parseInt(input.value, 10);
    if (!input.value.trim() || isNaN(val) || val < 1) {
      delete t.levelLessons[lvlOverrideLevelId];
    } else {
      t.levelLessons[lvlOverrideLevelId] = val;
    }
  });
  closeLevelOverride();
  toast('特殊講数を設定しました');
  renderContentList();
});

/* ── CRUD shared helpers ── */
function attachCrudInput(inp) {
  inp.addEventListener('input', e => {
    const idx = +e.target.dataset.idx, f = e.target.dataset.field, arr = e.target.dataset.arr;
    cfg[arr][idx][f] = f === 'lessons' ? Math.max(1, parseInt(e.target.value)||1) : e.target.value;
  });
}
function moveArr(arr, i, dir, render) {
  const j = i + dir;
  if (j < 0 || j >= cfg[arr].length) return;
  [cfg[arr][i], cfg[arr][j]] = [cfg[arr][j], cfg[arr][i]];
  render();
}
function delArr(arr, i, render) { cfg[arr].splice(i, 1); render(); }

/* ── Save content settings ── */
document.getElementById('saveContentBtn').addEventListener('click', async () => {
  cfg.siteTitle = document.getElementById('siteTitleInput').value.trim();
  if (!cfg.years.length && !cfg.terms.length && !cfg.levels.length) {
    toast('保存するコンテンツがありません', 'err'); return;
  }
  const errs = [];
  cfg.years.forEach((y,i)  => { if (!y.name.trim()) errs.push(`年度${i+1}の表示名が空です`); if (!y.tag.trim()) errs.push(`年度${i+1}のタグが空です`); });
  cfg.terms.forEach((t,i)  => { if (!t.name.trim()) errs.push(`学期${i+1}の表示名が空です`); if (!t.tag.trim()) errs.push(`学期${i+1}のタグが空です`); });
  cfg.levels.forEach((l,i) => { if (!l.name.trim()) errs.push(`レベル${i+1}の表示名が空です`); if (!l.tag.trim()) errs.push(`レベル${i+1}のタグが空です`); });
  if (errs.length) { toast(errs[0], 'err'); return; }

  persistLocal();
  const savedCount = `年度${cfg.years.length} / 学期${cfg.terms.length} / レベル${cfg.levels.length}`;
  const statusEl = document.getElementById('contentStatus');
  if (statusEl) statusEl.textContent = `保存済み: ${savedCount}`;
  try {
    await saveSettingsJson();
    toast(`保存しました [${savedCount}]`);
  } catch (e) {
    toast(e.message === 'R2未設定' ? `保存しました [${savedCount}]` : `保存しました（R2エラー: ${e.message}）`, e.message === 'R2未設定' ? 'ok' : 'err');
  }
});

/* ── R2 settings ── */
function loadR2Fields() {
  document.getElementById('r2BaseUrl').value     = cfg.r2BaseUrl    || '';
  document.getElementById('r2AccountId').value   = cfg.r2AccountId  || '';
  document.getElementById('r2AccessKeyId').value = cfg.r2AccessKeyId || '';
  document.getElementById('r2SecretKey').value   = cfg.r2SecretKey  || '';
  document.getElementById('r2Bucket').value      = cfg.r2Bucket     || 'textaudio';
  document.getElementById('r2WorkerUrl').value   = cfg.r2WorkerUrl  || '';
  document.getElementById('siteUrl').value       = cfg.siteUrl      || '';
}
document.getElementById('saveR2Btn').addEventListener('click', async () => {
  cfg.r2BaseUrl     = document.getElementById('r2BaseUrl').value.trim().replace(/\/$/, '');
  cfg.r2AccountId   = document.getElementById('r2AccountId').value.trim();
  cfg.r2AccessKeyId = document.getElementById('r2AccessKeyId').value.trim();
  cfg.r2SecretKey   = document.getElementById('r2SecretKey').value.trim();
  cfg.r2Bucket      = document.getElementById('r2Bucket').value.trim() || 'textaudio';
  cfg.r2WorkerUrl   = document.getElementById('r2WorkerUrl').value.trim().replace(/\/$/, '');
  cfg.siteUrl       = document.getElementById('siteUrl').value.trim().replace(/\/$/, '');
  persistLocal(); // Save credentials to localStorage — only called once here

  // Try to restore content settings from R2 (update cfg in memory only; no second persistLocal)
  const fetchUrls = [...new Set([cfg.r2WorkerUrl, cfg.r2BaseUrl].filter(Boolean).map(u => u.replace(/\/$/, '')))];
  let loaded = false;
  for (const url of fetchUrls) {
    try {
      const r = await fetch(`${url}/settings.json`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.years?.length)  { cfg.years  = j.years;  loaded = true; }
      if (j.terms?.length)  { cfg.terms  = j.terms;  loaded = true; }
      if (j.levels?.length) { cfg.levels = j.levels; loaded = true; }
      if (j.defaultYear)  cfg.defaultYear  = j.defaultYear;
      if (j.defaultTerm)  cfg.defaultTerm  = j.defaultTerm;
      if (j.defaultLevel) cfg.defaultLevel = j.defaultLevel;
      if (j.lessonTitles && Object.keys(j.lessonTitles).length) cfg.lessonTitles = j.lessonTitles;
      if (j.siteUrl) cfg.siteUrl = j.siteUrl;
      break;
    } catch {}
  }
  loadR2Fields();
  renderYearList(); renderTermList(); renderLevelList();
  // Also upload settings.json to R2 now that we have credentials/URL
  try {
    await saveSettingsJson();
    toast('R2設定を保存しました');
  } catch (e) {
    toast(e.message === 'R2未設定' ? 'R2設定を保存しました' : 'R2設定を保存しました（R2への書き込み失敗）', e.message === 'R2未設定' ? 'ok' : 'err');
  }
});
document.getElementById('testConnBtn').addEventListener('click', async () => {
  const url = document.getElementById('r2BaseUrl').value.trim().replace(/\/$/, '');
  if (!url) { toast('ベースURLを入力してください', 'err'); return; }
  try {
    const r = await fetch(`${url}/settings.json`);
    toast(r.ok ? '接続テスト成功' : r.status === 404 ? '接続OK（settings.json未作成）' : `接続エラー（HTTP ${r.status}）`, r.ok || r.status === 404 ? 'ok' : 'err');
  } catch { toast('接続できませんでした', 'err'); }
});

/* ── File upload ── */
function populateUploadSelects() {
  const yS = document.getElementById('upYear');
  const tS = document.getElementById('upTerm');
  const lS = document.getElementById('upLevel');
  yS.innerHTML = '<option value="">年度を選択</option>' + cfg.years.map(y => `<option value="${y.id}">${y.name}</option>`).join('');
  tS.innerHTML = '<option value="">学期を選択</option>' + cfg.terms.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
  lS.innerHTML = '<option value="">レベルを選択</option>' + cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
}


let selectedFiles = [];
let lessonNums = [];

function guessLessonNum(filename, fallback) {
  const m = filename.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : fallback;
}

const fileDrop = document.getElementById('fileDrop');
const fileInput = document.getElementById('fileInput');
fileDrop.addEventListener('click', () => fileInput.click());
fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
fileDrop.addEventListener('drop', e => { e.preventDefault(); fileDrop.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

async function handleFiles(fileList) {
  const sorted = Array.from(fileList).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  selectedFiles = await Promise.all(sorted.map(async f => ({
    name: f.name,
    data: new Uint8Array(await f.arrayBuffer())
  })));
  lessonNums = selectedFiles.map((f, i) => guessLessonNum(f.name, i + 1));
  renderPreview();
}

function getUploadPath(idx) {
  const y = cfg.years.find(x => x.id === document.getElementById('upYear').value);
  const t = cfg.terms.find(x => x.id === document.getElementById('upTerm').value);
  const l = cfg.levels.find(x => x.id === document.getElementById('upLevel').value);
  if (!y || !t || !l) return null;
  return `${y.tag}/${t.tag}/${l.tag}/lesson${lessonNums[idx]}.mp3`;
}

function renderPreview() {
  const sec = document.getElementById('previewSection');
  if (!selectedFiles.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  const body = document.getElementById('previewBody');
  body.innerHTML = selectedFiles.map((f, i) => {
    const path = getUploadPath(i) || '（年度・学期・レベルを選択してください）';
    return `<tr>
      <td>${i+1}</td>
      <td>${esc(f.name)}</td>
      <td><input type="number" min="1" class="lesson-num-input" value="${lessonNums[i]}" data-idx="${i}"></td>
      <td class="preview-path" id="pp${i}">${path}</td>
    </tr>`;
  }).join('');
  body.querySelectorAll('.lesson-num-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const idx = +e.target.dataset.idx;
      lessonNums[idx] = Math.max(1, parseInt(e.target.value) || 1);
      const el = document.getElementById(`pp${idx}`);
      if (el) el.textContent = getUploadPath(idx) || '（未選択）';
    });
  });
}

['upYear','upTerm','upLevel'].forEach(id => document.getElementById(id).addEventListener('change', () => {
  renderPreview();
}));

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const y = cfg.years.find(x => x.id === document.getElementById('upYear').value);
  const t = cfg.terms.find(x => x.id === document.getElementById('upTerm').value);
  const l = cfg.levels.find(x => x.id === document.getElementById('upLevel').value);
  if (!y || !t || !l) { toast('年度・学期・レベルを選択してください', 'err'); return; }
  if (!selectedFiles.length) { toast('ファイルを選択してください', 'err'); return; }
  const useWorker = !!cfg.r2WorkerUrl;
  if (!useWorker && (!cfg.r2AccountId || !cfg.r2AccessKeyId || !cfg.r2SecretKey)) { toast('R2設定が未完了です（Worker URLかS3認証情報を入力してください）', 'err'); return; }

  const prog = document.getElementById('uploadProgress');
  const bar  = document.getElementById('progressBar');
  const txt  = document.getElementById('progressText');
  prog.style.display = 'block';
  document.getElementById('uploadBtn').disabled = true;
  let ok = 0, fail = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    const key  = `${y.tag}/${t.tag}/${l.tag}/lesson${lessonNums[i]}.mp3`;
    const url  = `https://${cfg.r2AccountId}.r2.cloudflarestorage.com/${cfg.r2Bucket}/${key}`;
    txt.textContent = `${i+1} / ${selectedFiles.length} — ${esc(file.name)}`;
    try {
      const res = useWorker
        ? await putViaWorker(key, file.data, 'audio/mpeg')
        : await signedPut(url, file.data, 'audio/mpeg');
      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`HTTP ${res.status} ${body.slice(0, 200)}`);
      }
      ok++;
    } catch (e) {
      fail++;
      console.error('Upload error:', e, 'URL:', useWorker ? `${cfg.r2WorkerUrl}/${key}` : url);
      toast(`${file.name}: ${e.message}`, 'err');
    }
    bar.style.width = ((i+1) / selectedFiles.length * 100) + '%';
  }
  txt.textContent = `完了: ${ok} 件${fail ? ' / 失敗: '+fail+' 件' : ''}`;
  document.getElementById('uploadBtn').disabled = false;
  if (!fail) toast(`${ok} 件アップロード完了`);
});

/* ── Pure-JS SHA-256 / HMAC fallback (for non-HTTPS contexts) ── */
function _sha256(data) {
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bl = data.length * 8;
  const pl = ((data.length + 9 + 63) & ~63) - data.length;
  const m = new Uint8Array(data.length + pl);
  m.set(data); m[data.length] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(m.length - 8, Math.floor(bl / 0x100000000), false);
  dv.setUint32(m.length - 4, bl >>> 0, false);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < m.length; i += 64) {
    const W = new Uint32Array(64);
    for (let j = 0; j < 16; j++) W[j] = dv.getUint32(i + j * 4, false);
    for (let j = 16; j < 64; j++) {
      const s0 = r(W[j-15],7) ^ r(W[j-15],18) ^ (W[j-15]>>>3);
      const s1 = r(W[j-2],17) ^ r(W[j-2],19) ^ (W[j-2]>>>10);
      W[j] = (W[j-16] + s0 + W[j-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let j = 0; j < 64; j++) {
      const S1 = r(e,6)^r(e,11)^r(e,25), ch = (e&f)^(~e&g);
      const t1 = (h + S1 + ch + K[j] + W[j]) >>> 0;
      const S0 = r(a,2)^r(a,13)^r(a,22), maj = (a&b)^(a&c)^(b&c);
      const t2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    H = [H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x>>>0);
  }
  const out = new Uint8Array(32); const ov = new DataView(out.buffer);
  H.forEach((v,i) => ov.setUint32(i*4, v, false));
  return out;
}
function _hmac(key, data) {
  if (key.length > 64) key = _sha256(key);
  const ik = new Uint8Array(64), ok = new Uint8Array(64);
  ik.set(key); ok.set(key);
  for (let i = 0; i < 64; i++) { ik[i] ^= 0x36; ok[i] ^= 0x5c; }
  const inner = new Uint8Array(64 + data.length);
  inner.set(ik); inner.set(data, 64);
  const outer = new Uint8Array(96);
  outer.set(ok); outer.set(_sha256(inner), 64);
  return _sha256(outer);
}
const _hasCrypto = typeof crypto !== 'undefined' && crypto.subtle;

/* ── AWS Signature V4 ── */
async function sha256hex(data) {
  const buf = typeof data === 'string' ? new TextEncoder().encode(data) : data;
  if (_hasCrypto) {
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  return Array.from(_sha256(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hmacBytes(keyMat, msg) {
  const key  = keyMat instanceof Uint8Array ? keyMat : new TextEncoder().encode(keyMat);
  const data = new TextEncoder().encode(msg);
  if (_hasCrypto) {
    const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
  }
  return _hmac(key, data);
}
async function hmacHex(keyMat, msg) {
  return Array.from(await hmacBytes(keyMat, msg)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function putViaWorker(key, body, contentType) {
  const base = cfg.r2WorkerUrl.replace(/\/$/, '');
  return fetch(`${base}/${key}`, {
    method: 'PUT',
    headers: { 'Content-Type': contentType },
    body: body instanceof Uint8Array ? new Blob([body], { type: contentType }) : body
  });
}

async function signedPut(url, body, contentType) {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const ds  = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}`;
  const amz = `${ds}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const region = 'auto', service = 's3';
  const u = new URL(url);
  let bodyBlob;
  if (body instanceof Blob) bodyBlob = body;
  else if (body instanceof Uint8Array) bodyBlob = new Blob([body], { type: contentType });
  else bodyBlob = new Blob([new TextEncoder().encode(body)], { type: contentType });
  const payHash = 'UNSIGNED-PAYLOAD';
  const canonHeaders = `content-type:${contentType}\nhost:${u.hostname}\nx-amz-content-sha256:${payHash}\nx-amz-date:${amz}\n`;
  const signedHdrs   = 'content-type;host;x-amz-content-sha256;x-amz-date';
  const canonReq     = `PUT\n${u.pathname}\n\n${canonHeaders}\n${signedHdrs}\n${payHash}`;
  const credScope    = `${ds}/${region}/${service}/aws4_request`;
  const sts          = `AWS4-HMAC-SHA256\n${amz}\n${credScope}\n${await sha256hex(canonReq)}`;
  const kDate = await hmacBytes('AWS4' + cfg.r2SecretKey, ds);
  const kReg  = await hmacBytes(kDate, region);
  const kSvc  = await hmacBytes(kReg, service);
  const kSign = await hmacBytes(kSvc, 'aws4_request');
  const sig   = await hmacHex(kSign, sts);
  return fetch(url, {
    method: 'PUT',
    mode: 'cors',
    headers: {
      'Authorization': `AWS4-HMAC-SHA256 Credential=${cfg.r2AccessKeyId}/${credScope}, SignedHeaders=${signedHdrs}, Signature=${sig}`,
      'x-amz-date': amz, 'x-amz-content-sha256': payHash, 'Content-Type': contentType
    },
    body: bodyBlob
  });
}

/* ── Content list ── */
function mk(yId, tId, lId, n) { return `${yId}_${tId}_${lId}_${n}`; }
function allRows() {
  const rows = [];
  for (const y of cfg.years)
    for (const t of cfg.terms)
      for (const l of cfg.levels) {
        const lessons = (t.levelLessons || {})[l.id] ?? t.lessons;
        for (let n = 1; n <= lessons; n++)
          rows.push({ y, t, l, n, key: mk(y.id, t.id, l.id, n) });
      }
  return rows;
}
function audioUrl(y, t, l, n) { return `${cfg.r2BaseUrl}/${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`; }
function qrUrl(y, t, l, n) {
  const base = (cfg.siteUrl || BASE_URL).replace(/\/$/, '');
  return `${base}/?year=${y.tag}&term=${t.tag}&level=${l.tag}&lesson=${n}`;
}

  const yS = document.getElementById('clYear');

  const yv = yS.value, tv = tS.value, lv = lS.value;

  yS.innerHTML = cfg.years.map(y  => `<option value="${y.id}">${y.name}</option>`).join('');
  tS.innerHTML = cfg.terms.map(t  => `<option value="${t.id}">${t.name}</option>`).join('');
  lS.innerHTML = cfg.levels.map(l => `<option value="${l.id}">${l.name}</option>`).join('');
  if (yv) yS.value = yv; else if (saved.year)  yS.value = saved.year;
  if (tv) tS.value = tv; else if (saved.term)  tS.value = saved.term;
  if (lv) lS.value = lv; else if (saved.level) lS.value = saved.level;

    ['clYear','clTerm','clLevel'].forEach(id =>
      document.getElementById(id).addEventListener('change', () => { saveClFilter(); renderContentList(); })

  }

function renderContentList() {
  if (!_clFiltersReady) populateClFilters();
  const yF = document.getElementById('clYear').value;
  const tF = document.getElementById('clTerm').value;
  const lF = document.getElementById('clLevel').value;
  const rows = allRows().filter(r => (!yF || r.y.id === yF) && (!tF || r.t.id === tF) && (!lF || r.l.id === lF));
  settingsPlayerRows = rows;
  const con = document.getElementById('contentListTable');
  if (!rows.length) { con.innerHTML = '<div class="msg-c">コンテンツがありません</div>'; return; }
  let h = '<table class="cl"><thead><tr><th style="white-space:nowrap;">講</th><th>タイトル</th><th>操作</th></tr></thead><tbody>';
  for (const r of rows) {
    const title = cfg.lessonTitles?.[r.key] || '';
    h += `<tr>
      <td style="white-space:nowrap;">第${r.n}講</td>
      <td><input class="lt-input" data-key="${r.key}" value="${esc(title)}" placeholder="タイトル（任意）" style="width:100%;min-width:120px;height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;box-sizing:border-box;"></td>
      <td class="ops" style="white-space:nowrap;">
        <button class="cl-icon-btn cl-play" id="clplay-${r.key}" disabled onclick="openPlayer('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})" title="再生"><i class="fas fa-play"></i></button>
        <button class="cl-icon-btn cl-qr" onclick="openQr('${r.y.id}','${r.t.id}','${r.l.id}',${r.n})" title="QRコード"><i class="fas fa-qrcode"></i></button>
        <button class="cl-icon-btn cl-del" id="cldel-${r.key}" disabled onclick="deleteLesson('${r.y.id}','${r.t.id}','${r.l.id}',${r.n},'${r.key}')" title="削除"><i class="fas fa-trash"></i></button>
      </td>
    </tr>`;
  }
  con.innerHTML = h + '</tbody></table>';
  if (cfg.r2BaseUrl) {
    rows.forEach(r => {
      fetch(audioUrl(r.y, r.t, r.l, r.n), { method: 'HEAD' }).then(res => {
        if (res.ok) {
          const pb = document.getElementById(`clplay-${r.key}`);
          if (pb) pb.disabled = false;
          const db = document.getElementById(`cldel-${r.key}`);
          if (db) db.disabled = false;
        }
      }).catch(() => {});
    });
  }
}

async function deleteLesson(yId, tId, lId, n, key) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  if (!confirm(`第${n}講（${y.name} / ${t.name} / ${l.name}）の音声をR2から削除しますか？`)) return;
  if (!cfg.r2WorkerUrl) { toast('Worker URLが未設定のため削除できません', 'err'); return; }
  const fileKey = `${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`;
  try {
    const res = await fetch(`${cfg.r2WorkerUrl.replace(/\/$/, '')}/${fileKey}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    toast(`第${n}講 の音声を削除しました`);
    const pb = document.getElementById(`clplay-${key}`);
    if (pb) pb.disabled = true;
    const db = document.getElementById(`cldel-${key}`);
    if (db) db.disabled = true;
  } catch (e) {
    toast(`削除に失敗しました: ${e.message}`, 'err');
  }
}

  const r = document.getElementById('progWrap').getBoundingClientRect();

  if (audio.duration) audio.currentTime = p * audio.duration;

// ─── Visualizer (PCM + FFT) ────────────────────────────────
const VIZ_BARS = 40, FFT_N = 512;
let vizRaf = null, vizSmooth = new Float32Array(VIZ_BARS), vizPeak = 0.0001;

function resizeVizCanvas() {
  const c = document.getElementById('vizCanvas');
  if (!c) return;
  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
}
function fftMag(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { const tr=re[i];re[i]=re[j];re[j]=tr; const ti=im[i];im[i]=im[j];im[j]=ti; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2*Math.PI/len, wre=Math.cos(ang), wim=Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cre=1, cim=0;
      for (let k = 0; k < len>>1; k++) {
        const a=i+k, b=a+(len>>1);
        const tre=re[b]*cre-im[b]*cim, tim=re[b]*cim+im[b]*cre;
        re[b]=re[a]-tre; im[b]=im[a]-tim; re[a]+=tre; im[a]+=tim;
        const ncre=cre*wre-cim*wim; cim=cre*wim+cim*wre; cre=ncre;
      }
    }
  }
}
function drawViz() {
  const c = document.getElementById('vizCanvas');
  if (!c) { vizRaf = null; return; }
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=c.clientHeight;
  const ctx2=c.getContext('2d');
  ctx2.clearRect(0,0,c.width,c.height); ctx2.save(); ctx2.scale(dpr,dpr);
  const mags = new Float32Array(VIZ_BARS);
  if (currentPCM && audio.duration && !audio.paused) {
    const re=new Float32Array(FFT_N), im=new Float32Array(FFT_N);
    const start=Math.floor(audio.currentTime*currentPCM.sampleRate), d=currentPCM.data;
    for (let i=0;i<FFT_N;i++) { const s=d[start+i]||0, w=0.5*(1-Math.cos(2*Math.PI*i/(FFT_N-1))); re[i]=s*w; }
    fftMag(re,im);
    const halfN=FFT_N>>1; let frameMax=0;
    for (let b=0;b<VIZ_BARS;b++) {
      const lo=Math.floor(Math.pow(b/VIZ_BARS,1.6)*halfN), hi=Math.max(lo+1,Math.floor(Math.pow((b+1)/VIZ_BARS,1.6)*halfN));
      let sum=0,cnt=0;
      for (let k=lo;k<hi&&k<halfN;k++) { sum+=Math.sqrt(re[k]*re[k]+im[k]*im[k]); cnt++; }
      const v=cnt?sum/cnt:0; mags[b]=v; if(v>frameMax) frameMax=v;
    }
    vizPeak=Math.max(vizPeak*0.96,frameMax,0.0001);
  }
  const usableH=H-4, gap=3, barW=(W-gap*(VIZ_BARS-1))/VIZ_BARS;
  const grad=ctx2.createLinearGradient(0,H,W,0);
  grad.addColorStop(0,'#4A7AE0'); grad.addColorStop(0.5,'#8B7FE8'); grad.addColorStop(1,'#C490F5');
  ctx2.fillStyle=grad;
  for (let i=0;i<VIZ_BARS;i++) {
    const target=Math.min(1,mags[i]/vizPeak);
    vizSmooth[i]+=(target-vizSmooth[i])*0.35;
    const barH=Math.max(3,vizSmooth[i]*usableH), x=i*(barW+gap), y=H-barH, r=Math.min(3,barW/2);
    ctx2.beginPath();
    ctx2.moveTo(x+r,y); ctx2.lineTo(x+barW-r,y); ctx2.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx2.lineTo(x+barW,y+barH); ctx2.lineTo(x,y+barH); ctx2.lineTo(x,y+r);
    ctx2.quadraticCurveTo(x,y,x+r,y); ctx2.closePath(); ctx2.fill();
  }
  ctx2.restore();
  vizRaf=requestAnimationFrame(drawViz);
}
function startViz() { if (vizRaf) return; drawViz(); }
function stopViz() {
  if (vizRaf) { cancelAnimationFrame(vizRaf); vizRaf=null; }
  vizSmooth.fill(0); vizPeak=0.0001;
  const c=document.getElementById('vizCanvas');
  if (c) c.getContext('2d').clearRect(0,0,c.width,c.height);
}

// ─── Static waveform (progress bar) ───────────────────────
const waveformCache={};
let currentWaveform=null, currentWaveformKey=null, currentPCM=null;

function resizeWaveCanvas() {
  const c=document.getElementById('waveCanvas');
  if (!c) return;
  const dpr=window.devicePixelRatio||1;
  c.width=c.clientWidth*dpr; c.height=c.clientHeight*dpr;
}
function drawWaveform() {
  const c=document.getElementById('waveCanvas');
  if (!c) return;
  const ctx2=c.getContext('2d'), dpr=window.devicePixelRatio||1;
  const W=c.clientWidth, H=c.clientHeight;
  ctx2.clearRect(0,0,c.width,c.height); ctx2.save(); ctx2.scale(dpr,dpr);
  const BARS=60, gap=2, barW=(W-gap*(BARS-1))/BARS;
  if (!currentWaveform) {
    ctx2.fillStyle='rgba(91,141,239,0.18)';
    for (let i=0;i<BARS;i++) ctx2.fillRect(i*(barW+gap),H-3,barW,3);
    ctx2.restore(); return;
  }
  const usableH=H-4, progress=audio.duration?audio.currentTime/audio.duration:0, progressX=progress*W;
  const gradP=ctx2.createLinearGradient(0,H,W,0);
  gradP.addColorStop(0,'#4A7AE0'); gradP.addColorStop(0.5,'#8B7FE8'); gradP.addColorStop(1,'#C490F5');
  for (let i=0;i<BARS;i++) {
    const x=i*(barW+gap), barH=Math.max(3,currentWaveform[i]*usableH), y=H-barH, r=Math.min(4,barW/2);
    ctx2.fillStyle=(x+barW/2)<=progressX?gradP:'rgba(91,141,239,0.22)';
    ctx2.beginPath();
    ctx2.moveTo(x+r,y); ctx2.lineTo(x+barW-r,y); ctx2.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx2.lineTo(x+barW,y+barH); ctx2.lineTo(x,y+barH); ctx2.lineTo(x,y+r);
    ctx2.quadraticCurveTo(x,y,x+r,y); ctx2.closePath(); ctx2.fill();
  }
  ctx2.restore();
}
async function loadWaveform(url, key) {
  currentWaveformKey=key; currentPCM=null;
  currentWaveform=waveformCache[key]||null; drawWaveform();
  let decCtx;
  try { decCtx=new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { return; }
  try {
    const res=await fetch(url), buf=await res.arrayBuffer();
    const decoded=await decCtx.decodeAudioData(buf);
    const ch=decoded.getChannelData(0);
    if (currentWaveformKey===key) currentPCM={data:ch.slice(0),sampleRate:decoded.sampleRate};
    if (!waveformCache[key]) {
      const BARS=60, step=Math.floor(ch.length/BARS), wf=new Float32Array(BARS);
      for (let i=0;i<BARS;i++) { let s=0; for (let j=0;j<step;j++) s+=ch[i*step+j]**2; wf[i]=Math.sqrt(s/step); }
      let mx=0; for (let i=0;i<BARS;i++) if(wf[i]>mx) mx=wf[i];
      if (mx>0) for (let i=0;i<BARS;i++) wf[i]/=mx;
      waveformCache[key]=wf;
    }
    if (currentWaveformKey===key) { currentWaveform=waveformCache[key]; drawWaveform(); }
    decCtx.close();
  } catch(e) { try { decCtx.close(); } catch(_) {} }
}
// ──────────────────────────────────────────────────────────

function openPlayer(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  cur = { yId, tId, lId, n };
  updateNavButtons();
  document.getElementById('playerTitle').textContent = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  audio.src = audioUrl(y, t, l, n);
  audio.currentTime = 0; setPI(false);
  document.getElementById('durTime').textContent = '0:00';
  document.getElementById('curTime').textContent = '0:00';
  setSpeed(1);
  pOverlay.classList.add('open');
  requestAnimationFrame(() => {
    resizeVizCanvas();
    resizeWaveCanvas();
    const wfBase = (cfg.r2WorkerUrl || cfg.r2BaseUrl).replace(/\/$/, '');
    loadWaveform(`${wfBase}/${y.tag}/${t.tag}/${l.tag}/lesson${n}.mp3`, mk(yId, tId, lId, n));
  });
}
function closePlayer() {
  audio.pause(); stopViz();
  currentWaveform = null; currentWaveformKey = null; currentPCM = null;
  const wc = document.getElementById('waveCanvas');
  if (wc) wc.getContext('2d').clearRect(0, 0, wc.width, wc.height);
  pOverlay.classList.remove('open'); cur = null;
}

function getCurIdx() {
  if (!cur) return -1;
  return settingsPlayerRows.findIndex(r => r.y.id === cur.yId && r.t.id === cur.tId && r.l.id === cur.lId && r.n === cur.n);
}
function updateNavButtons() {
  const idx = getCurIdx();
  const total = settingsPlayerRows.length;
  const btnP = document.getElementById('btnPrevLesson');
  const btnN = document.getElementById('btnNextLesson');
  if (btnP) btnP.disabled = idx <= 0;
  if (btnN) btnN.disabled = idx < 0 || idx >= total - 1;
  const lbl = document.getElementById('navLabel');
  if (lbl) lbl.textContent = total > 1 ? `${idx + 1} / ${total}` : '';
}
document.getElementById('btnPrevLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx > 0) { const r = settingsPlayerRows[idx - 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
document.getElementById('btnNextLesson').addEventListener('click', () => {
  const idx = getCurIdx();
  if (idx >= 0 && idx < settingsPlayerRows.length - 1) { const r = settingsPlayerRows[idx + 1]; openPlayer(r.y.id, r.t.id, r.l.id, r.n); }
});
document.getElementById('btnClose').addEventListener('click', closePlayer);
pOverlay.addEventListener('click', e => { if (e.target === pOverlay) closePlayer(); });

/* ── QR ── */
const qrOverlay = document.getElementById('qrOverlay');

function openQr(yId, tId, lId, n) {
  const y = cfg.years.find(x => x.id === yId);
  const t = cfg.terms.find(x => x.id === tId);
  const l = cfg.levels.find(x => x.id === lId);
  if (!y || !t || !l) return;
  const url = qrUrl(y, t, l, n);
  document.getElementById('qrTitle').textContent = `${y.name} / ${t.name} / ${l.name} / 第${n}講`;
  document.getElementById('qrUrlText').textContent = url;
  const canvas = document.getElementById('qrCanvas');
  canvas.innerHTML = '';
  new QRCode(canvas, { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById('btnCopyUrl').onclick = () => {
    navigator.clipboard.writeText(url)
      .then(() => toast('URLをコピーしました'))
      .catch(() => toast('コピーできませんでした', 'err'));
  };
  qrOverlay.classList.add('open');
}
document.getElementById('qrClose').addEventListener('click', () => qrOverlay.classList.remove('open'));
qrOverlay.addEventListener('click', e => { if (e.target === qrOverlay) qrOverlay.classList.remove('open'); });

/* ── localStorage availability check ── */
function checkLocalStorage() {
  try {
    const testKey = '__dke_test__';
    localStorage.setItem(testKey, '1');
    const ok = localStorage.getItem(testKey) === '1';
    localStorage.removeItem(testKey);
    return ok;
  } catch { return false; }
}

const lsAvailable = checkLocalStorage();
if (!lsAvailable) {
  // Show a persistent warning banner
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:56px;left:0;right:0;z-index:100;background:#c62828;color:#fff;font-size:.85rem;font-weight:600;padding:10px 16px;text-align:center;line-height:1.5;';
  banner.innerHTML = '⚠️ LocalStorageが無効です。プライベートブラウジングをオフにするか、ブラウザのストレージ設定を確認してください。設定は保存されません。';
  document.body.appendChild(banner);
}

/* ── Init ── */
async function init() {
  await loadAllSettings();
  renderYearList();
  renderTermList();
  renderLevelList();
  loadR2Fields();
  const savedTab = localStorage.getItem('dke_active_tab');
  if (savedTab) switchTab(savedTab);
}
init();
</script>
